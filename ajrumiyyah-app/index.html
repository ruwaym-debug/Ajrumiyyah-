<style>
:root{padding-top:env(safe-area-inset-top,0px);color-scheme:light;
 --paper:#F3F1F8;--surface:#FCFBFE;--ink:#1D1838;--mute:#625C7D;--rule:#D9D4E8;--tint:#E9E5F4;--line:#E7E2F2;
 --sf:#F0B13A;--sfx:#B97C00;--focus:#4B34D6;--ok:#12744F;--no:#B8321F;
 --raf:#2459D6;--nasb:#9A5A00;--khafd:#0F7A52;--jazm:#BF3326;
 --ui:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
 --serif:'Newsreader',Georgia,'Times New Roman',serif;
 --ar:'Scheherazade New','Traditional Arabic',serif;
 --lift:0 10px 30px rgba(29,24,56,.16)}
:root[data-theme="dark"]{color-scheme:dark;--paper:#120E26;--surface:#1B1639;--ink:#EEEAFB;--mute:#A59FC6;--rule:#2F2A59;--tint:#241E48;--line:#2A2552;--sf:#F4BE4A;--sfx:#F4BE4A;--focus:#B8A9FF;--ok:#52CFA0;--no:#FF8F80;--raf:#8DB1FF;--nasb:#F2C24E;--khafd:#52CFA0;--jazm:#FF9486;--lift:0 10px 30px rgba(0,0,0,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="dark"]){color-scheme:dark;--paper:#120E26;--surface:#1B1639;--ink:#EEEAFB;--mute:#A59FC6;--rule:#2F2A59;--tint:#241E48;--line:#2A2552;--sf:#F4BE4A;--sfx:#F4BE4A;--focus:#B8A9FF;--ok:#52CFA0;--no:#FF8F80;--raf:#8DB1FF;--nasb:#F2C24E;--khafd:#52CFA0;--jazm:#FF9486;--lift:0 10px 30px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:16px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.7 var(--serif);padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
button{font-family:var(--ui)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;top:-60px;left:12px;z-index:100;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font:600 15px var(--ui);transition:top .15s;text-decoration:none}
.skip:focus{top:12px}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#main:focus{outline:none}

/* shell */
.w{max-width:720px;margin:0 auto;padding:0 18px}

/* masthead: rosette marker, meta, prev/next, title, tracker */
.mast{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:0 14px;padding:20px 0 0}
.mark{position:relative;width:58px;height:58px;display:grid;place-items:center;flex:none}
.mark svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mark .st{fill:var(--surface);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;transition:fill .2s}
.mark .rg{fill:none;stroke:var(--ink);stroke-width:1;opacity:.4}
.mark.done .st{fill:var(--sf)}
.mark b{position:relative;font:700 19px/1 var(--ui);font-variant-numeric:tabular-nums;color:var(--ink)}
.mark.done b{color:#1D1838}
.ct{margin:0;font:600 15px/1.35 var(--ui);color:var(--mute);display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.ct .tag{display:inline-flex;align-items:center;gap:5px;background:var(--sf);color:#1D1838;border-radius:999px;padding:1px 10px 1px 8px;font:700 13px/1.6 var(--ui)}
.nv{display:flex;gap:8px}
.ar2{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--rule);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ar2 svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ar2:disabled{opacity:.3;cursor:not-allowed}
.ar2:not(:disabled):active{background:var(--tint)}
h2{grid-column:1/-1;margin:16px 0 14px;font:700 clamp(28px,6.6vw,42px)/1.1 var(--ui);letter-spacing:-.022em;text-wrap:balance}
.pg{grid-column:1/-1;display:flex;gap:2px;align-items:flex-end;height:10px;margin:0 0 20px}
.pg i{flex:1;height:4px;border-radius:2px;background:var(--rule);transition:height .2s,background .2s}
.pg i.d{background:var(--sfx)}
.pg i.c{height:10px;background:var(--ink)}

/* layer toggles (multi-select) */
.sg{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.sg[hidden]{display:none}
.sg button{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 16px;border-radius:14px;border:1.5px solid var(--rule);background:var(--surface);color:var(--mute);font:600 15px var(--ui);cursor:pointer;white-space:nowrap}
.sg button:before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid currentColor;flex:none;opacity:.7}
.sg button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.sg button[aria-pressed="true"]:before{background:var(--sf);border-color:var(--ink);opacity:1}

/* segmented controls (single-select) */
.md,.lvltabs{display:flex;gap:2px;padding:4px;border-radius:16px;background:var(--tint);margin:0 0 14px}
.md button,.lvltabs button{flex:1;min-width:0;min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--mute);font:600 15px var(--ui);cursor:pointer;padding:0 8px;text-align:center}
.md button[aria-selected="true"],.md button[aria-pressed="true"],.lvltabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(29,24,56,.16),0 0 0 1px var(--rule)}

.fullbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border-radius:16px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:700 16px var(--ui);cursor:pointer;margin:0 0 14px}
.fullbtn[aria-pressed="true"]{background:var(--sf);color:#1D1838}

/* the matn: ruled manuscript page */
.ar{font-family:var(--ar);font-size:clamp(28px,6.6vw,46px);line-height:2.3;direction:rtl;text-align:right;color:var(--ink);background-color:var(--surface);background-image:linear-gradient(to bottom,transparent calc(100% - 1px),var(--line) 0);background-size:100% 2.3em;background-origin:content-box;background-repeat:repeat-y;border:1px solid var(--rule);border-inline-start:5px solid var(--sf);border-radius:8px;padding:.4em .7em;margin:0 0 6px}

/* margin-note layers */
.lay{border-top:1px solid var(--rule);padding:22px 0 10px;margin:0}
.lay h3{margin:0;font:700 18px/1.3 var(--ui)}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.lb p{max-width:62ch;margin:0 0 .9em}
.lb p:last-child{margin-bottom:.4em}
.pl{border:1.5px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:999px;font:600 13px var(--ui);cursor:pointer;padding:0 14px;min-height:38px;white-space:nowrap}
.pl[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mu{color:var(--mute);font-size:16px}
.lay.solo{border:1px solid var(--rule);border-radius:14px;background:var(--surface);padding:16px 18px;margin:14px 0}
.lay.solo h3{font-size:16px;margin-bottom:4px}
.lay.solo p{margin:0 0 .6em;max-width:none}
h3{scroll-margin-top:70px}

/* examples by level */
.lvlcard{background:var(--tint);border:1.5px dashed var(--rule);border-radius:14px;padding:20px 18px;text-align:center;cursor:pointer}
.lvlcard .ar0b{font:clamp(28px,6vw,38px)/1.9 var(--ar);display:block}
.lvlbadge{display:block;font:600 14px var(--ui);color:var(--mute);margin-bottom:6px}
.reveal-en{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);font-size:17px}
.lvlcard.sh .reveal-en{display:block}

/* diagram parts (case colours: raf blue, nasb amber, khafd green, jazm red) */
.x{--c:var(--mute)}.r{--c:var(--raf)}.n{--c:var(--nasb)}.k{--c:var(--khafd)}.j{--c:var(--jazm)}
.cp{display:inline-block;color:var(--c);background:var(--tint);background:color-mix(in srgb,var(--c) 11%,var(--surface));border:1px solid var(--c);border:1px solid color-mix(in srgb,var(--c) 42%,transparent);border-radius:10px;padding:1px 12px;margin:3px 2px;font:600 20px/1.75 var(--ar)}
.gt{display:block;color:var(--mute);font:600 14px var(--ui);margin:8px 0 2px;position:relative}
.vt{text-align:center}
.vt .root{display:inline-block;background:var(--ink);color:var(--paper);border-radius:12px;padding:4px 24px;font:700 28px/1.8 var(--ar)}
.vt .kids{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px;position:relative}
.vt .kids:before{content:"";position:absolute;top:-14px;left:12%;right:12%;height:2px;background:var(--rule)}
.vt .root:after{content:"";display:block;width:2px;height:12px;background:var(--rule);margin:6px auto -18px}
.kid{border:1px solid var(--rule);border-top:4px solid var(--c);border-radius:12px;padding:8px 12px;flex:1;min-width:96px;background:var(--surface)}
.kid b{display:block;color:var(--c);font:700 24px/1.8 var(--ar)}
.mr{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.sg2{min-width:88px;text-align:center;border-radius:12px;background:var(--c);color:var(--paper);padding:4px 10px}
.sg2 .ar0{display:block;font:700 26px/1.8 var(--ar)}
.ar-{color:var(--mute)}.mc{display:flex;flex-wrap:wrap;gap:2px}
.br{margin:8px 0;padding:10px 12px;border-radius:12px;background:var(--tint)}.br small{display:block;color:var(--mute);font:600 14px var(--ui);margin-bottom:2px}
.pl2{color:var(--mute);margin:0 2px}
.se{display:flex;flex-wrap:wrap;gap:10px;direction:rtl;margin:8px 0}
.wp{text-align:center;border-bottom:3px solid var(--c);padding:2px 6px}
.wp .ar0{display:block;font:28px/1.9 var(--ar)}
.vs{border-top:1px dashed var(--rule);margin-top:14px;padding-top:10px}.vs:first-of-type{border:0;margin:0;padding:0}
.tp{position:relative;cursor:pointer}
.tp .en{margin:0;display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:4px 10px;border-radius:8px;font:500 14px/1.4 var(--ui);white-space:normal;width:max-content;max-width:min(240px,70vw);text-align:center;direction:ltr;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.tp.sh .en{display:block}
@media (hover:hover){.tp:hover .en,.tp:focus-visible .en{display:block}}
.allen .tp .en{display:block;position:static;transform:none;background:none;color:var(--mute);padding:0;box-shadow:none;width:auto;max-width:none;font-size:13px}
.allen .cp .en{display:inline;margin-left:6px}
.allen .cp.tp{border-radius:12px}
.sg2 .en,.allen .sg2 .en{color:var(--paper)}

/* memorize */
.fc{cursor:pointer;min-height:240px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 26px;border-radius:18px;background:var(--surface);border:1px solid var(--rule);box-shadow:inset 0 0 0 10px var(--surface),inset 0 0 0 11px var(--rule);font-size:22px;line-height:1.55}
.fc .ar{width:100%}
.h{filter:blur(8px);cursor:pointer;display:inline-block}.wd{cursor:pointer}
.ok{color:var(--ok)}.no{color:var(--no)}
.mic{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:0 30px;min-height:56px;font:700 17px var(--ui);cursor:pointer}
.mic:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--sf)}

/* previous / next pager */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:36px 0 0;border-top:1px solid var(--rule);padding-top:22px}
.pgb{display:flex;flex-direction:column;gap:2px;text-align:left;min-height:70px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}

.dock{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(480px,calc(100% - 24px));background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--rule);border-radius:24px;padding:6px;z-index:8;box-shadow:var(--lift)}

<script>

const D=[{"t": "Kalām: what counts as speech", "v": [{"k": "chips", "items": ["لَفْظ Utterance", "مُرَكَّب 2+ words", "مُفِيد Beneficial", "بِالوَضْع Arabic usage"], "tone": "x", "t": "4 conditions of kalām"}, {"k": "tree", "root": "الكَلَام", "kids": [["اسْم", "noun · no time", "r"], ["فِعْل", "verb · with time", "n"], ["حَرْف", "particle · meaning only with others", "k"]]}], "ar": "الكَلامُ هُوَ اللَّفْظُ المُرَكَّبُ المُفِيدُ بِالوَضْعِ. وَأَقْسَامُهُ ثَلاثَةٌ: اسْمٌ، وَفِعْلٌ، وَحَرْفٌ جَاءَ لِمَعْنًى.", "en": "Speech is the composed utterance that is beneficial in its placement. It is of three parts: ism (noun), fi'l (verb), and harf (particle) that conveys a meaning.", "ex": ["The commentary breaks the definition into four conditions. It must be an <b>utterance</b>; it must be <b>compound</b> (two or more words, stated or implied); it must be <b>beneficial</b>; and it must be <b>established in Arabic usage</b>.", "Implied compounding: asked “Who is your brother?”, the answer “Muḥammadun” counts, because it carries the meaning “Muḥammadun is my brother”.", "Beneficial means the listener needs nothing more. “When the teacher is present” is an utterance of three words but not speech; “When the teacher is present, the students listen” is speech.", "Words from Persian, Turkish, Berber or European languages are not kalām for the grammarians, even if they are for those languages' speakers.", "The three parts: an <b>ism</b> indicates a meaning in itself with no tense (Muḥammad, a man, a river). A <b>fi'l</b> indicates a meaning in itself linked to a tense (kataba, past; yaktubu, present). A <b>ḥarf</b> gives a meaning only when joined to something else: “min” (from) is not complete until you say “I went from the house”."], "lvl": [{"ar": "قَامَ زَيْدٌ", "en": "Zayd stood — complete kalām"}, {"ar": "قَامَ زَيْدٌ وَجَلَسَ عَمْرٌو", "en": "Zayd stood and 'Amr sat — two joined sentences"}, {"ar": "إِنَّ الطَّالِبَ المُجْتَهِدَ يَنْجَحُ فِي دِرَاسَتِهِ", "en": "Indeed the diligent student succeeds in his studies"}]}, {"t": "Signs of the ism", "v": [{"k": "chips", "items": ["خَفْض", "تَنْوِين", "الـ"], "tone": "r", "t": "Three signs"}, {"k": "chips", "items": ["مِنْ", "إِلَى", "عَنْ", "عَلَى", "فِي", "رُبَّ", "بِ", "كَ", "لِ"], "tone": "k", "t": "Jarr letters"}, {"k": "chips", "items": ["وَ", "بِ", "تَ"], "tone": "n", "t": "Oath letters"}], "ar": "فَالِاسْمُ يُعْرَفُ بِالخَفْضِ، وَالتَّنْوِينِ، وَدُخُولِ الأَلِفِ وَاللَّامِ عَلَيْهِ، وَحُرُوفِ الخَفْضِ، وَهِيَ: مِنْ، وَإِلَى، وَعَنْ، وَعَلَى، وَفِي، وَرُبَّ، وَالبَاءُ، وَالكَافُ، وَاللَّامُ، وَحُرُوفُ القَسَمِ، وَهِيَ: الوَاوُ، وَالبَاءُ، وَالتَّاءُ.", "en": "The noun is known by khafḍ (jarr), tanwīn, and the entry of alif-lām; and by the letters of khafḍ: min, ilā, 'an, 'alā, fī, rubba, bā, kāf, lām; and the letters of oath: wāw, bā, tā.", "ex": ["The noun is told apart from the verb and particle by having one of these signs, or being able to accept one. The author names four: khafḍ, tanwīn, alif-lām, and the jarr particles.", "The commentary's example: “I went from the house to the school.” Both “the house” and “the school” are nouns because a jarr particle precedes them and “al-” starts each.", "<b>Min</b> = beginning (“I travelled from Cairo”). <b>Ilā</b> = end point (“to Alexandria”). <b>'Alā</b> = rising (“I climbed onto the mountain”). <b>'An</b> = moving away from (“I shot the arrow from the bow”).", "Oath letters: <b>wāw</b> is used only with a noun (“By Allah”). <b>Bā</b> works with a noun or a pronoun. <b>Tā</b> is used only with Allah's name."], "lvl": [{"ar": "الكِتَابُ", "en": "the book — has al-"}, {"ar": "فِي البَيْتِ", "en": "in the house — jarr letter fī"}, {"ar": "سَافَرْتُ مِنَ المَدِينَةِ إِلَى القَرْيَةِ", "en": "I travelled from the city to the village"}]}, {"t": "Signs of the fi'l", "v": [{"k": "chips", "items": ["قَدْ", "السِّين", "سَوْفَ", "تَاء التَّأْنِيث السَّاكِنَة"], "tone": "n", "t": "Four signs"}, {"k": "sent", "w": [["قَدْ قَامَ", "qad", "x"], ["سَيَقُومُ", "sīn", "x"], ["سَوْفَ يَقُومُ", "sawfa", "x"], ["قَامَتْ", "tā", "x"]], "n": null}], "ar": "وَالفِعْلُ يُعْرَفُ بِقَدْ، وَالسِّينِ، وَسَوْفَ، وَتَاءِ التَّأْنِيثِ السَّاكِنَةِ.", "en": "The verb is known by qad, sīn, sawfa, and the silent tā of femininity.", "ex": ["Four signs. If a word has one or accepts one, it is a verb.", "From the commentary: <b>qad</b> can give emphasis (“the believers have indeed succeeded”) or show the imminent beginning of the action.", "<b>Sīn</b> and <b>sawfa</b> go with the present verb and mark the future. The silent <b>tā of femininity</b> goes with the past verb and shows a feminine doer: “'Ā'ishah said…”."], "lvl": [{"ar": "كَتَبَ", "en": "he wrote — accepts qad"}, {"ar": "سَيَكْتُبُ الرِّسَالَةَ", "en": "he will write the letter — sīn"}, {"ar": "قَدْ كَتَبَتِ الطَّالِبَةُ الدَّرْسَ", "en": "the student has indeed written the lesson — tā of femininity"}]}, {"t": "The ḥarf", "v": [{"k": "ba", "rows": [["Ism signs?", [["✗ None", "j"]]], ["Fi'l signs?", [["✗ None", "j"]]], ["So it is a", [["حَرْف", "r"]]]], "n": null}], "ar": "وَالحَرْفُ مَا لَا يَصْلُحُ مَعَهُ دَلِيلُ الِاسْمِ وَلَا دَلِيلُ الفِعْلِ.", "en": "The harf is that which accepts neither the signs of the noun nor the signs of the verb.", "ex": ["Linguistically ḥarf means “the side”. Grammatically it is a word whose meaning appears only in something else.", "The ḥarf has no signs of its own. It is identified by the absence of both: it cannot take tanwīn, “al-” or jarr, and it cannot take qad, sīn, sawfa or the tā of femininity.", "The commentary's example is “min”: it means beginning, but the meaning is only completed in a phrase like “I went from the house”."], "lvl": [{"ar": "فِي", "en": "in — meaning only completes with a noun"}, {"ar": "هَلْ نَجَحْتَ؟", "en": "did you succeed? — a question particle"}, {"ar": "وَلَكِنَّ الحَقَّ سَيَظْهَرُ", "en": "but the truth will show — lākinna"}]}, {"t": "I'rāb: changing the ending", "v": [{"k": "map", "rows": [["رَفْع", "Raf'", ["Ism ✓", "Fi'l ✓"], "r"], ["نَصْب", "Naṣb", ["Ism ✓", "Fi'l ✓"], "n"], ["خَفْض", "Khafḍ", ["Ism ✓", "Fi'l ✗"], "k"], ["جَزْم", "Jazm", ["Ism ✗", "Fi'l ✓"], "j"]], "n": null}, {"k": "sent", "w": [["مُحَمَّدٌ", "raf'", "r"], ["مُحَمَّدًا", "naṣb", "n"], ["مُحَمَّدٍ", "khafḍ", "k"]], "n": "Same word, different ending because a different governor entered."}], "ar": "الإِعْرَابُ هُوَ تَغْيِيرُ أَوَاخِرِ الكَلِمِ لِاخْتِلَافِ العَوَامِلِ الدَّاخِلَةِ عَلَيْهَا لَفْظًا أَوْ تَقْدِيرًا. وَأَقْسَامُهُ أَرْبَعَةٌ: رَفْعٌ، وَنَصْبٌ، وَخَفْضٌ، وَجَزْمٌ. فَلِلْأَسْمَاءِ مِنْ ذَلِكَ الرَّفْعُ وَالنَّصْبُ وَالخَفْضُ، وَلَا جَزْمَ فِيهَا. وَلِلْأَفْعَالِ مِنْ ذَلِكَ الرَّفْعُ وَالنَّصْبُ وَالجَزْمُ، وَلَا خَفْضَ فِيهَا.", "en": "I'rāb is the changing of word endings due to the differing of the operators entering them, whether apparent or assumed. It has four types: raf', naṣb, khafḍ, jazm. Nouns have raf', naṣb, khafḍ (no jazm). Verbs have raf', naṣb, jazm (no khafḍ).", "ex": ["The letter itself does not change; the <b>state</b> of the ending does, because a different governor ('āmil) enters. Take Muḥammad: “Muḥammadun came” (marfū'), “I saw Muḥammadan” (manṣūb), “I passed by Muḥammadin” (majrūr, because of the bā).", "Raf', naṣb and jarr are the marks of inflection. The present verb resembles the noun here: “Ibrāhīm yusāfiru” is marfū' because nothing puts it in naṣb or jazm.", "<b>Apparent</b> i'rāb shows on the letter. <b>Implicit</b> (assumed) i'rāb is blocked from showing by impracticality (al-fatā), heaviness (al-qāḍī), or the place being occupied by the pronoun yā (ghulāmī)."], "lvl": [{"ar": "زَيْدٌ، زَيْدًا، زَيْدٍ", "en": "the same name in raf', naṣb, khafḍ"}, {"ar": "قَامَ الرَّجُلُ", "en": "the man stood — raf'"}, {"ar": "رَأَيْتُ الرَّجُلَ الَّذِي نَجَحَ", "en": "I saw the man who succeeded — naṣb"}]}, {"t": "Signs of raf'", "v": [{"k": "map", "rows": [["ـُ", "Ḍammah", ["singular", "broken plural", "sound fem. plural", "present verb"], "r"], ["و", "Wāw", ["sound masc. plural", "five nouns"], "r"], ["ا", "Alif", ["dual"], "r"], ["ن", "Nūn", ["five verbs"], "r"]], "n": null}, {"k": "sent", "w": [["زَيْدٌ", "ḍammah", "r"], ["الزَّيْدُونَ", "wāw", "r"], ["أَبُوكَ", "wāw", "r"], ["الزَّيْدَانِ", "alif", "r"], ["يَقُومَانِ", "nūn", "r"]], "n": null}], "ar": "لِلرَّفْعِ أَرْبَعُ عَلَامَاتٍ: الضَّمَّةُ، وَالوَاوُ، وَالأَلِفُ، وَالنُّونُ.", "en": "Raf' has four signs: the ḍammah, the wāw, the alif, and the nūn.", "ex": ["The ḍammah is the original sign of raf'. The wāw, alif and nūn are substitutes that stand in its place.", "<b>Wāw</b> = sound masculine plural and the five nouns. <b>Alif</b> = the dual. <b>Nūn</b> = the five verbs, when the present verb has a dual, plural or feminine-addressee pronoun attached.", "<b>Ḍammah</b> = singular noun, broken plural, sound feminine plural, and the present verb with nothing attached to its end."], "lvl": [{"ar": "الوَلَدُ نَشِيطٌ", "en": "the boy is active — ḍammah"}, {"ar": "الوَلَدَانِ قَائِمَانِ", "en": "the two boys are standing — alif"}, {"ar": "المُعَلِّمُونَ يَشْرَحُونَ الدَّرْسَ", "en": "the teachers explain the lesson — wāw and nūn"}]}, {"t": "Signs of naṣb", "v": [{"k": "map", "rows": [["ـَ", "Fatḥah", ["singular", "broken plural", "present verb after naṣb particle"], "n"], ["ا", "Alif", ["five nouns"], "n"], ["ـِ", "Kasrah", ["sound fem. plural"], "n"], ["ي", "Yā", ["dual", "sound masc. plural"], "n"], ["حذف ن", "Deleted nūn", ["five verbs"], "n"]], "n": null}, {"k": "sent", "w": [["أَبَاكَ", "alif", "n"], ["مُسْلِمَاتٍ", "kasrah", "n"], ["الزَّيْدَيْنِ", "yā", "n"], ["لَنْ يَقُومُوا", "no nūn", "n"]], "n": null}], "ar": "وَلِلنَّصْبِ خَمْسُ عَلَامَاتٍ: الفَتْحَةُ، وَالأَلِفُ، وَالكَسْرَةُ، وَاليَاءُ، وَحَذْفُ النُّونِ.", "en": "Naṣb has five signs: the fatḥah, the alif, the kasrah, the yā, and the removal of the nūn.", "ex": ["The fatḥah is the original sign of naṣb. The alif, kasrah, yā and the deletion of the nūn are substitutes.", "<b>Alif</b> for the five nouns (ra'aytu abāka). <b>Kasrah</b> for the sound feminine plural. <b>Yā</b> for the dual and sound masculine plural. <b>Deleted nūn</b> for the five verbs, where raf' shows by the nūn staying.", "<b>Fatḥah</b> for the singular, broken plural, and the present verb after a naṣb particle with nothing attached."], "lvl": [{"ar": "كِتَابًا", "en": "a book — fatḥah"}, {"ar": "رَأَيْتُ أَخَاكَ", "en": "I saw your brother — alif of the five nouns"}, {"ar": "لَنْ يَنْجَحَ الطُّلَّابُ الكُسَالَى", "en": "the lazy students will not succeed — fatḥah after lan"}]}, {"t": "Signs of khafḍ", "ar": "وَلِلْخَفْضِ ثَلَاثُ عَلَامَاتٍ: الكَسْرَةُ، وَاليَاءُ، وَالفَتْحَةُ. فَأَمَّا الكَسْرَةُ: فَتَكُونُ عَلَامَةً لِلْخَفْضِ فِي ثَلَاثَةِ مَوَاضِعَ: فِي الِاسْمِ المُفْرَدِ المُنْصَرِفِ، وَجَمْعِ التَّكْسِيرِ المُنْصَرِفِ، وَجَمْعِ المُؤَنَّثِ السَّالِمِ. وَأَمَّا اليَاءُ: فَتَكُونُ عَلَامَةً لِلْخَفْضِ فِي ثَلَاثَةِ مَوَاضِعَ: فِي الأَسْمَاءِ الخَمْسَةِ، وَفِي التَّثْنِيَةِ، وَالجَمْعِ. وَأَمَّا الفَتْحَةُ: فَتَكُونُ عَلَامَةً لِلْخَفْضِ فِي الِاسْمِ الَّذِي لَا يَنْصَرِفُ.", "en": "Khafḍ has three signs: the kasrah, the yā, and the fatḥah. The kasrah is the sign in three cases: the singular noun that takes changeable vowel marks, the broken plural with changeable marks, and the sound feminine plural. The yā: the five nouns, the dual, and the plural. The fatḥah: nouns whose vowel marks are fixed and do not change (diptotes).", "ex": ["The kasrah is the root sign of khafḍ; the yā and fatḥah are substitute signs the commentary calls subsidiary.", "Kasrah covers three cases: a singular noun that takes tanwīn (marartu bi-Muḥammadin), a triptote broken plural, and the sound feminine plural.", "Yā covers the five nouns, the dual, and the sound plural. Fatḥah covers diptotes — nouns barred from tanwīn, such as some proper names — which take khafḍ with a fatḥah instead of a kasrah (marartu bi-Ibrāhīma)."], "v": [{"k": "map", "rows": [["ـِ", "Kasrah", ["singular", "broken plural", "sound fem. plural"], "k"], ["ي", "Yā", ["five nouns", "dual", "sound masc. plural"], "k"], ["ـَ", "Fatḥah", ["diptote (doesn't take tanwīn)"], "k"]], "n": null}], "lvl": [{"ar": "بِالقَلَمِ", "en": "with the pen — kasrah"}, {"ar": "فِي المَدْرَسَتَيْنِ", "en": "in the two schools — yā of the dual"}, {"ar": "ذَهَبْتُ إِلَى بَيْتِ أَخِي", "en": "I went to my brother's house — yā of the five nouns"}]}, {"t": "Signs of jazm", "ar": "وَلِلْجَزْمِ عَلَامَتَانِ: السُّكُونُ، وَالحَذْفُ. فَأَمَّا السُّكُونُ: فَيَكُونُ عَلَامَةً لِلْجَزْمِ فِي الفِعْلِ المُضَارِعِ الصَّحِيحِ الآخِرِ. وَأَمَّا الحَذْفُ: فَيَكُونُ عَلَامَةً لِلْجَزْمِ فِي الفِعْلِ المُضَارِعِ المُعْتَلِّ الآخِرِ، وَفِي الأَفْعَالِ الَّتِي رَفْعُهَا بِثَبَاتِ النُّونِ.", "en": "Jazm has two signs: sukūn and removal. Sukūn is the sign in the present verb that ends with a sound letter. Removal is the sign in the present verb whose last letter is weak (alif, wāw, yā), and in the five verbs whose raf' is shown by the nūn staying.", "ex": ["Sukūn is the root sign of jazm; removal (ḥadhf) is the subsidiary sign, each with its own set of cases.", "Sukūn marks jazm on a present verb whose last letter is sound (lam yaktub).", "Removal marks jazm in two places: a present verb ending in a weak letter — alif, wāw or yā — drops that letter (lam yakhsha, lam yarḍa), and the five verbs drop their nūn (lam yaktubā)."], "v": [{"k": "map", "rows": [["ـْ", "Sukūn", ["present verb ending in a sound letter"], "j"], ["حذف", "Removal", ["present verb ending in weak letter", "five verbs: nūn drops"], "j"]], "n": null}], "lvl": [{"ar": "لَمْ يَكْتُبْ", "en": "he did not write — sukūn"}, {"ar": "لَمْ يَدْعُ", "en": "he did not call — weak letter removed"}, {"ar": "إِنْ تَجْتَهِدَا تَنْجَحَا", "en": "if you two strive, you two will succeed — nūn dropped"}]}, {"t": "Words inflected by ḥarakāt", "ar": "المُعْرَبَاتُ قِسْمَانِ: قِسْمٌ يُعْرَبُ بِالحَرَكَاتِ، وَقِسْمٌ يُعْرَبُ بِالحُرُوفِ. فَالَّذِي يُعْرَبُ بِالحَرَكَاتِ أَرْبَعَةُ أَنْوَاعٍ: الِاسْمُ المُفْرَدُ، وَجَمْعُ التَّكْسِيرِ، وَجَمْعُ المُؤَنَّثِ السَّالِمِ، وَالفِعْلُ المُضَارِعُ الَّذِي لَمْ يَتَّصِلْ بِآخِرِهِ شَيْءٌ. وَكُلُّهَا تُرْفَعُ بِالضَّمَّةِ، وَتُنْصَبُ بِالفَتْحَةِ، وَتُخْفَضُ بِالكَسْرَةِ، وَتُجْزَمُ بِالسُّكُونِ. وَخَرَجَ عَنْ ذَلِكَ ثَلَاثَةُ أَشْيَاءَ: جَمْعُ المُؤَنَّثِ السَّالِمِ يُنْصَبُ بِالكَسْرَةِ، وَالِاسْمُ الَّذِي لَا يَنْصَرِفُ يُخْفَضُ بِالفَتْحَةِ، وَالفِعْلُ المُضَارِعُ المُعْتَلُّ الآخِرِ يُجْزَمُ بِحَذْفِ آخِرِهِ.", "en": "The words inflected are of two groups: those inflected by vowel marks and those by letters. By vowel marks: the singular noun, the broken plural, the sound feminine plural, and the present verb with nothing attached. All are raised with ḍammah, put in naṣb with fatḥah, in khafḍ with kasrah, and in jazm with sukūn. Three exceptions: the sound feminine plural takes kasrah in naṣb; the diptote takes fatḥah in khafḍ; the weak-ended present verb takes jazm by removing its last letter.", "ex": ["These four word-types (singular noun, broken plural, sound feminine plural, present verb with nothing attached) are inflected by plain vowel marks rather than letters, which is why grammarians group them together.", "The three exceptions worth memorising: the sound feminine plural takes naṣb with a kasrah, not a fatḥah; a diptote takes khafḍ with a fatḥah, not a kasrah; and a weak-ended present verb takes jazm by dropping its last letter rather than by sukūn."], "v": [{"k": "tree", "root": "يُعْرَبُ بِالحَرَكَات", "kids": [["مُفْرَد", "singular", "x"], ["جَمْع تَكْسِير", "broken plural", "x"], ["جَمْع مُؤَنَّث سَالِم", "sound fem. plural", "x"], ["مُضَارِع", "present verb", "x"]]}, {"k": "map", "rows": [["ـُ ـَ ـِ ـْ", "normal", ["raf' ḍammah", "naṣb fatḥah", "khafḍ kasrah", "jazm sukūn"], "x"], ["ـِ", "exception 1", ["sound fem. plural: naṣb by kasrah"], "n"], ["ـَ", "exception 2", ["diptote: khafḍ by fatḥah"], "k"], ["حذف", "exception 3", ["weak-ended verb: jazm by removal"], "j"]], "n": null}], "lvl": [{"ar": "الطَّالِبُ، الطَّالِبَ، الطَّالِبِ", "en": "one word, three plain vowel endings"}, {"ar": "الطَّالِبَاتُ مُجْتَهِدَاتٌ", "en": "the students (f.) are diligent — sound fem. plural"}, {"ar": "شَاهَدْتُ مَدَارِسَ كَثِيرَةً", "en": "I saw many schools — broken plural in naṣb by fatḥah"}]}, {"t": "Words inflected by letters", "ar": "وَالَّذِي يُعْرَبُ بِالحُرُوفِ أَرْبَعَةُ أَنْوَاعٍ: التَّثْنِيَةُ، وَجَمْعُ المُذَكَّرِ السَّالِمِ، وَالأَسْمَاءُ الخَمْسَةُ، وَالأَفْعَالُ الخَمْسَةُ، وَهِيَ: يَفْعَلَانِ، وَتَفْعَلَانِ، وَيَفْعَلُونَ، وَتَفْعَلُونَ، وَتَفْعَلِينَ. فَأَمَّا التَّثْنِيَةُ: فَتُرْفَعُ بِالأَلِفِ، وَتُنْصَبُ وَتُخْفَضُ بِاليَاءِ. وَأَمَّا جَمْعُ المُذَكَّرِ السَّالِمُ: فَيُرْفَعُ بِالوَاوِ، وَيُنْصَبُ وَيُخْفَضُ بِاليَاءِ. وَأَمَّا الأَسْمَاءُ الخَمْسَةُ: فَتُرْفَعُ بِالوَاوِ، وَتُنْصَبُ بِالأَلِفِ، وَتُخْفَضُ بِاليَاءِ. وَأَمَّا الأَفْعَالُ الخَمْسَةُ: فَتُرْفَعُ بِثَبَاتِ النُّونِ، وَتُنْصَبُ وَتُجْزَمُ بِحَذْفِهَا.", "en": "Inflected by letters are four types: the dual, the sound masculine plural, the five nouns, and the five verbs (yaf'alāni, taf'alāni, yaf'alūna, taf'alūna, taf'alīna). The dual: raf' with alif; naṣb and khafḍ with yā. The sound masculine plural: raf' with wāw; naṣb and khafḍ with yā. The five nouns: raf' with wāw, naṣb with alif, khafḍ with yā. The five verbs: raf' by the nūn staying; naṣb and jazm by removing it.", "ex": ["These four types (the dual, the sound masculine plural, the five nouns, the five verbs) are inflected by whole letters standing in for the vowel marks, not by the marks themselves.", "Every alif, wāw, yā and nūn sign covered in the earlier raf', naṣb, khafḍ and jazm sections belongs to one of these four word-types — this section is really a summary that ties them together."], "v": [{"k": "map", "rows": [["مُثَنَّى", "dual", ["raf': ا", "naṣb + khafḍ: ي"], "r"], ["جَمْع مُذَكَّر", "sound masc. plural", ["raf': و", "naṣb + khafḍ: ي"], "r"], ["الأَسْمَاء الخَمْسَة", "five nouns", ["raf': و", "naṣb: ا", "khafḍ: ي"], "r"], ["الأَفْعَال الخَمْسَة", "five verbs", ["raf': نون ثابتة", "naṣb + jazm: حذف النون"], "r"]], "n": null}, {"k": "chips", "items": ["يَفْعَلَانِ", "تَفْعَلَانِ", "يَفْعَلُونَ", "تَفْعَلُونَ", "تَفْعَلِينَ"], "tone": "j", "t": "The five verbs"}], "lvl": [{"ar": "الوَلَدَانِ", "en": "the two boys — dual, raf' by alif"}, {"ar": "رَأَيْتُ المُهَنْدِسِينَ", "en": "I saw the engineers — sound masc. plural, naṣb by yā"}, {"ar": "أَبُوكَ وَأَخُوكَ يَعْمَلَانِ هُنَا", "en": "your father and your brother work here — five nouns + dual verb"}]}, {"t": "The three verbs", "v": [{"k": "tree", "root": "الفِعْل", "kids": [["مَاضٍ", "ضَرَبَ · past", "x"], ["مُضَارِع", "يَضْرِبُ · present", "n"], ["أَمْر", "اضْرِبْ · command", "k"]]}, {"k": "chips", "items": ["أ", "ن", "ي", "ت"], "tone": "n", "t": "Present verb starts with one of"}], "ar": "الأَفْعَالُ ثَلَاثَةٌ: مَاضٍ، وَمُضَارِعٌ، وَأَمْرٌ، نَحْوُ: ضَرَبَ، وَيَضْرِبُ، وَاضْرِبْ. فَالمَاضِي: مَفْتُوحُ الآخِرِ أَبَدًا. وَالأَمْرُ: مَجْزُومٌ أَبَدًا. وَالمُضَارِعُ: مَا كَانَ فِي أَوَّلِهِ إِحْدَى الزَّوَائِدِ الأَرْبَعِ، يَجْمَعُهَا قَوْلُكَ «أَنَيْتُ»، وَهُوَ مَرْفُوعٌ أَبَدًا، حَتَّى يَدْخُلَ عَلَيْهِ نَاصِبٌ أَوْ جَازِمٌ.", "en": "Verbs are three: past, present, and command, like ḍaraba, yaḍribu, iḍrib. The past always ends with a fatḥah; the command is always in jazm; the present begins with one of four extra letters gathered in أَنَيْتُ and is always marfū' until a naṣb or jazm article enters.", "ex": ["The <b>past</b> (māḍī) is linked to a time before speaking; the <b>present</b> (muḍāri') begins with one of the letters of أَنَيْتُ.", "The <b>command</b> (amr) asks for an action to be done after the moment of speaking: write, understand, listen, help. The commentary notes it is built on the same basis as the present verb, so in a sense it falls under the muḍāri'."], "lvl": [{"ar": "كَتَبَ، يَكْتُبُ، اُكْتُبْ", "en": "past, present, command of the same root"}, {"ar": "الطَّالِبُ يَكْتُبُ الدَّرْسَ الآنَ", "en": "the student is writing the lesson now"}, {"ar": "اُكْتُبْ وَاجِبَكَ قَبْلَ أَنْ تَخْرُجَ", "en": "write your homework before you go out"}]}, {"t": "Nawāṣib and jawāzim", "ar": "فَالنَّوَاصِبُ عَشَرَةٌ، وَهِيَ: أَنْ، وَلَنْ، وَإِذَنْ، وَكَيْ، وَلَامُ كَيْ، وَلَامُ الجُحُودِ، وَحَتَّى، وَالجَوَابُ بِالفَاءِ، وَالوَاوِ، وَأَوْ. وَالجَوَازِمُ ثَمَانِيَةَ عَشَرَ، وَهِيَ: لَمْ، وَلَمَّا، وَأَلَمْ، وَأَلَمَّا، وَلَامُ الأَمْرِ وَالدُّعَاءِ، وَ«لَا» فِي النَّهْيِ وَالدُّعَاءِ، وَإِنْ، وَمَا، وَمَنْ، وَمَهْمَا، وَإِذْمَا، وَأَيٌّ، وَمَتَى، وَأَيَّانَ، وَأَيْنَ، وَأَنَّى، وَحَيْثُمَا، وَكَيْفَمَا، وَ«إِذَا» فِي الشِّعْرِ خَاصَّةً.", "en": "The articles of naṣb are ten: an, lan, idhan, kay, lām kay, lām al-juḥūd, ḥattā, and the answer with fā', wāw and aw. The articles of jazm are eighteen in your Arabic matn: lam, lammā, alam, alammā, the lām of command and supplication, lā of prohibition and supplication, in, mā, man, mahmā, idhmā, ayy, matā, ayyāna, ayna, annā, ḥaythumā, kayfamā, and idhā in poetry only. (The English PDF says “twelve”, which does not match its own list.)", "ex": ["The ten naṣb particles fall into three groups: those that put the verb in naṣb by themselves (an, lan), those that allow an implicit an after them, and those where an implicit an is obligatory.", "The jazm particles include the negating and prohibiting lam, lammā and lā, and the conditional particles (in, man, mā, mahmā and others), which put both the condition and its result into jazm."], "v": [{"k": "chips", "items": ["أَنْ", "لَنْ", "إِذَنْ", "كَيْ", "لَامُ كَيْ", "لَامُ الجُحُودِ", "حَتَّى", "فَاءُ الجَوَابِ", "وَاوُ المَعِيَّةِ", "أَوْ"], "tone": "n", "t": "Ten naṣb articles"}, {"k": "chips", "items": ["لَمْ", "لَمَّا", "أَلَمْ", "أَلَمَّا", "لَامُ الأَمْرِ", "لَا النَّاهِيَة", "إِنْ", "مَا", "مَنْ", "مَهْمَا", "إِذْمَا", "أَيٌّ", "مَتَى", "أَيَّانَ", "أَيْنَ", "أَنَّى", "حَيْثُمَا", "كَيْفَمَا", "إِذَا (شِعْر)"], "tone": "j", "t": "Jazm articles"}], "lvl": [{"ar": "لَنْ أَذْهَبَ", "en": "I will not go — naṣb"}, {"ar": "لَمْ أَذْهَبْ", "en": "I did not go — jazm"}, {"ar": "إِنْ تَذْهَبْ إِلَى السُّوقِ أَشْتَرِ مَعَكَ فَاكِهَةً", "en": "if you go to the market I'll buy fruit with you"}]}, {"t": "The fā'il (doer)", "v": [{"k": "sent", "w": [["قَامَ", "verb first", "x"], ["زَيْدٌ", "doer · raf'", "r"]], "n": "Verb first, then the doer in raf'."}], "ar": "الفَاعِلُ هُوَ الِاسْمُ المَرْفُوعُ المَذْكُورُ قَبْلَهُ فِعْلُهُ.", "en": "The doer is the noun in raf' that is preceded by its verb.", "ex": ["The commentary defines the doer as a noun, in raf', preceded by the verb it belongs to. Preceded by its verb rules out the mubtada' and the noun of inna, which never come after a verb.", "It also rules out the noun of kāna and kāda, which come after verbs that don't count as full verbs here. “Verb” includes verb-like words such as a maṣdar or an active participle.", "Example: qāma Zaydun, “Zayd stood”. The doer can be apparent or implicit (the twelve pronouns like أَنَا)."], "lvl": [{"ar": "قَامَ زَيْدٌ", "en": "Zayd stood"}, {"ar": "يَلْعَبُ الأَوْلَادُ فِي الحَدِيقَةِ", "en": "the boys play in the garden"}, {"ar": "نَجَحَتِ الطَّالِبَاتُ المُجْتَهِدَاتُ فِي الِامْتِحَانِ", "en": "the diligent students succeeded in the exam"}]}, {"t": "The passive subject (nā'ib al-fā'il)", "v": [{"k": "ba", "rows": [["Active: doer named", [["ضَرَبَ", "x"], ["زَيْدٌ · doer", "r"], ["عَمْرًا · naṣb", "n"]]], ["Passive: doer dropped", [["ضُرِبَ", "x"], ["عَمْرٌ · raf'", "r"]]]], "n": "The object moves from naṣb to raf'. Past: ḍammah first, kasrah before last. Present: ḍammah first, fatḥah before last."}], "ar": "الـمَفْعُولُ الَّذِي لَمْ يُسَمَّ فَاعِلُهُ هُوَ الِاسْمُ الـمَرْفُوعُ الَّذِي لَمْ يُذْكَرْ مَعَهُ فَاعِلُهُ. فَإِنْ كَانَ الفِعْلُ مَاضِيًا: ضُمَّ أَوَّلُهُ وَكُسِرَ مَا قَبْلَ آخِرِهِ، وَإِنْ كَانَ مُضَارِعًا: ضُمَّ أَوَّلُهُ وَفُتِحَ مَا قَبْلَ آخِرِهِ. نَحْوُ قَوْلِكَ: ضُرِبَ زَيْدٌ، وَيُضْرَبُ زَيْدٌ، وَأُكْرِمَ عَمْرٌو، وَيُكْرَمُ عَمْرٌو.", "en": "The object whose doer is not named is the noun in raf' with which no doer is mentioned. If the verb is past, its first letter takes ḍammah and the letter before the last takes kasrah; if present, its first takes ḍammah and the letter before the last takes fatḥah. Examples: ḍuriba Zaydun, yuḍrabu Zaydun, ukrima 'Amrun, yukramu 'Amrun.", "ex": ["The commentary says the speaker may drop the doer and mention only the verb and object. Then both change: the verb changes form, and the object becomes marfū' and takes the doer's rulings, so the verb must come first and be feminine if it is feminine.", "Because it stands in for the doer it is called the deputy (nā'ib) of the doer."], "lvl": [{"ar": "كُتِبَ الدَّرْسُ", "en": "the lesson was written"}, {"ar": "يُفْتَحُ البَابُ صَبَاحًا", "en": "the door is opened in the morning"}, {"ar": "كُرِّمَ الطُّلَّابُ المُتَفَوِّقُونَ فِي الحَفْلِ", "en": "the outstanding students were honoured at the ceremony"}]}, {"t": "The seven marfū'āt", "v": [{"k": "chips", "items": ["الفَاعِل", "نَائِب الفَاعِل", "المُبْتَدَأ", "خَبَرُهُ", "اسْم كَانَ", "خَبَر إِنَّ", "التَّابِع"], "tone": "r", "t": "Seven"}, {"k": "chips", "items": ["النَّعْت", "العَطْف", "التَّوْكِيد", "البَدَل"], "tone": "x", "t": "The follower is four"}], "ar": "الـمَرْفُوعَاتُ سَبْعَةٌ، وَهِيَ: الفَاعِلُ، وَالـمَفْعُولُ الَّذِي لَمْ يُسَمَّ فَاعِلُهُ، وَالمُبْتَدَأُ، وَخَبَرُهُ، وَاسْمُ كَانَ وَأَخَوَاتِهَا، وَخَبَرُ إِنَّ وَأَخَوَاتِهَا، وَالتَّابِعُ لِلْمَرْفُوعِ، وَهُوَ أَرْبَعَةُ أَشْيَاءَ: النَّعْتُ، وَالعَطْفُ، وَالتَّوْكِيدُ، وَالبَدَلُ.", "en": "The nouns in raf' are seven: the doer; the subject of a passive verb; the mubtada' (nominal subject); its khabar (predicate); the noun of kāna and her sisters; the predicate of inna and her sisters; and the follower of a marfū', which is four things: the adjective, the conjunction, the emphasis, and the substitution.", "ex": ["The commentary explains that these are the places where a noun takes raf'. The rest of the raf' chapters go through them one by one in this order.", "Memorise seven, then four followers: na't, 'atf, tawkīd, badal."], "lvl": [{"ar": "الوَلَدُ نَشِيطٌ", "en": "mubtada' and khabar"}, {"ar": "كَانَ الجَوُّ جَمِيلًا", "en": "kāna's noun and khabar"}, {"ar": "إِنَّ العِلْمَ نُورٌ يُضِيءُ الطَّرِيقَ", "en": "inna's noun and khabar"}]}, {"t": "Mubtada' and khabar", "v": [{"k": "sent", "w": [["زَيْدٌ", "mubtada' · raf'", "r"], ["قَائِمٌ", "khabar · raf'", "r"]], "n": "Both marfū' until a governor enters."}], "ar": "الـمُبْتَدَأُ هُوَ الِاسْمُ المَرْفُوعُ العَارِي عَنِ العَوَامِلِ اللَّفْظِيَّةِ. وَالخَبَرُ هُوَ الِاسْمُ المَرْفُوعُ المُسْنَدُ إِلَيْهِ، نَحْوُ: زَيْدٌ قَائِمٌ، وَالزَّيْدَانِ قَائِمَانِ، وَالزَّيْدُونَ قَائِمُونَ.", "en": "The mubtada' is the noun in raf' free from verbal governors. The khabar is the noun in raf' attributed to it, like: Zaydun qā'imun, al-zaydāni qā'imāni, al-zaydūna qā'imūna. The mubtada' is either apparent or implicit (like أَنَا، نَحْنُ، هُوَ), and the khabar is either a single word or not (jār-majrūr, adverbial, a verb with its doer, or a mubtada' with its khabar).", "ex": ["The commentary explains that although both the mubtada' and khabar are marfū' by default, certain governors can enter the sentence and override that state — this is exactly what the following three chapters (kāna, inna, ẓanna) describe.", "A khabar can be a single word, or one of four non-single forms: a jarr-majrūr phrase, an adverbial phrase, a verb with its doer, or another mubtada' with its own khabar."], "lvl": [{"ar": "البَيْتُ كَبِيرٌ", "en": "the house is big — single-word khabar"}, {"ar": "الحَدِيقَةُ خَلْفَ البَيْتِ", "en": "the garden is behind the house — khabar is a ẓarf"}, {"ar": "العِلْمُ يَرْفَعُ صَاحِبَهُ بَيْنَ النَّاسِ", "en": "knowledge raises its owner among people — khabar is a verb sentence"}]}, {"t": "Kāna and her sisters", "v": [{"k": "ba", "rows": [["Before", [["زَيْدٌ · raf'", "r"], ["قَائِمٌ · raf'", "r"]]], ["After كَانَ", [["كَانَ", "x"], ["زَيْدٌ · raf'", "r"], ["قَائِمًا · naṣb", "n"]]]], "n": "Kāna raises the noun, lowers the khabar."}, {"k": "chips", "items": ["كَانَ", "أَمْسَى", "أَصْبَحَ", "أَضْحَى", "ظَلَّ", "بَاتَ", "صَارَ", "لَيْسَ", "مَا زَالَ", "مَا انْفَكَّ", "مَا فَتِئَ", "مَا بَرِحَ", "مَا دَامَ"], "tone": "r", "t": ""}], "ar": "فَأَمَّا كَانَ وَأَخَوَاتُهَا فَإِنَّهَا تَرْفَعُ الِاسْمَ وَتَنْصِبُ الخَبَرَ، وَهِيَ: كَانَ، وَأَمْسَى، وَأَصْبَحَ، وَأَضْحَى، وَظَلَّ، وَبَاتَ، وَصَارَ، وَلَيْسَ، وَمَا زَالَ، وَمَا انْفَكَّ، وَمَا فَتِئَ، وَمَا بَرِحَ، وَمَا دَامَ، وَمَا تَصَرَّفَ مِنْهَا، نَحْوُ: كَانَ زَيْدٌ قَائِمًا، وَلَيْسَ عَمْرٌو شَاخِصًا.", "en": "Kāna and her sisters enter a nominal sentence: they keep the subject in raf' (as their noun) and put the predicate in naṣb (as their khabar). They are: kāna, amsā, aṣbaḥa, aḍḥā, ẓalla, bāta, ṣāra, laysa, mā zāla, mā infakka, mā fati'a, mā bariḥa, mā dāma, and whatever is derived from them. Examples: Kāna Zaydun qā'iman, and Laysa 'Amrun shākhiṣan.", "ex": ["The commentary calls these the abrogators of the mubtada' and khabar, since they change its ruling. The first type makes the mubtada' marfū' and its khabar manṣūb: kāna and her sisters, each of which is a verb, e.g. “the weather was clear”.", "Memory aid: <b>kāna raises the noun, lowers (naṣb) the khabar</b>. Zaydun stays marfū' as kāna's ism; qā'iman is manṣūb as her khabar."], "lvl": [{"ar": "كَانَ الجَوُّ بَارِدًا", "en": "the weather was cold"}, {"ar": "أَصْبَحَ الطَّقْسُ مُعْتَدِلًا", "en": "the weather became mild"}, {"ar": "مَا زَالَ الطَّالِبُ مُجْتَهِدًا مُنْذُ صِغَرِهِ", "en": "the student has remained diligent since childhood"}]}, {"t": "Inna and her sisters", "v": [{"k": "ba", "rows": [["Before", [["زَيْدٌ · raf'", "r"], ["قَائِمٌ · raf'", "r"]]], ["After إِنَّ", [["إِنَّ", "x"], ["زَيْدًا · naṣb", "n"], ["قَائِمٌ · raf'", "r"]]]], "n": "Inna is the reverse of kāna."}, {"k": "chips", "items": ["إِنَّ", "أَنَّ", "لَكِنَّ", "كَأَنَّ", "لَيْتَ", "لَعَلَّ"], "tone": "n", "t": ""}, {"k": "map", "rows": [["إِنَّ أَنَّ", "", ["affirm"], "n"], ["لَكِنَّ", "", ["correct"], "n"], ["كَأَنَّ", "", ["compare"], "n"], ["لَيْتَ", "", ["wish"], "n"], ["لَعَلَّ", "", ["hope"], "n"]], "n": null}], "ar": "وَأَمَّا إِنَّ وَأَخَوَاتُهَا فَإِنَّهَا تَنْصِبُ الِاسْمَ وَتَرْفَعُ الخَبَرَ، وَهِيَ: إِنَّ، وَأَنَّ، وَلَكِنَّ، وَكَأَنَّ، وَلَيْتَ، وَلَعَلَّ، نَحْوُ: إِنَّ زَيْدًا قَائِمٌ، وَلَيْتَ عَمْرًا شَاخِصٌ.", "en": "Inna and her sisters put the noun in naṣb and the predicate in raf'. They are inna, anna, lākinna, ka'anna, layta, la'alla. Example: Inna Zaydan qā'imun. Inna and anna give affirmation, lākinna rectification, ka'anna comparison, layta wishing, la'alla hope.", "ex": ["The second type makes the mubtada' manṣūb and its khabar marfū'. Each of these is a particle, e.g. “Indeed, Allah is Exalted in Might and Wise”.", "Meanings: inna and anna affirm; lākinna corrects; ka'anna compares; layta wishes; la'alla hopes.", "Memory aid: <b>inna is the reverse of kāna</b>."], "lvl": [{"ar": "إِنَّ الدَّرْسَ سَهْلٌ", "en": "indeed the lesson is easy"}, {"ar": "لَعَلَّ الجَوَّ يَصْفُو غَدًا", "en": "perhaps the weather will clear tomorrow"}, {"ar": "إِنَّ الصَّبْرَ مِفْتَاحُ الفَرَجِ عِنْدَ الحُكَمَاءِ", "en": "indeed patience is the key to relief, according to the wise"}]}, {"t": "Ẓanna and her sisters", "v": [{"k": "map", "rows": [["كَانَ", "kāna", ["noun: raf'", "khabar: naṣb"], "r"], ["إِنَّ", "inna", ["noun: naṣb", "khabar: raf'"], "n"], ["ظَنَّ", "ẓanna", ["both: naṣb"], "k"]], "n": null}, {"k": "chips", "items": ["ظَنَنْتُ", "حَسِبْتُ", "خِلْتُ", "زَعَمْتُ", "رَأَيْتُ", "عَلِمْتُ", "وَجَدْتُ", "اتَّخَذْتُ", "جَعَلْتُ", "سَمِعْتُ"], "tone": "k", "t": ""}], "ar": "وَأَمَّا ظَنَنْتُ وَأَخَوَاتُهَا فَإِنَّهَا تَنْصِبُ المُبْتَدَأَ وَالخَبَرَ عَلَى أَنَّهُمَا مَفْعُولَانِ لَهَا، وَهِيَ: ظَنَنْتُ، وَحَسِبْتُ، وَخِلْتُ، وَزَعَمْتُ، وَرَأَيْتُ، وَعَلِمْتُ، وَوَجَدْتُ، وَاتَّخَذْتُ، وَجَعَلْتُ، وَسَمِعْتُ. تَقُولُ: ظَنَنْتُ زَيْدًا مُنْطَلِقًا، وَخِلْتُ عَمْرًا شَاخِصًا، وَمَا أَشْبَهَ ذَلِكَ.", "en": "Ẓanna and her sisters put both the mubtada' and khabar in naṣb, making them two objects of the verb. They are ẓanantu, ḥasibtu, khiltu, za'amtu, ra'aytu, 'alimtu, wajadtu, ittakhadhtu, ja'altu, sami'tu. Examples: ẓanantu Zaydan munṭaliqan; khiltu 'Amran shākhiṣan.", "ex": ["The commentary calls this the third abrogator: it makes <b>both</b> the mubtada' and the khabar manṣūb, and each of these is a verb, e.g. “I thought the friend was travelling”.", "Compare: kāna raises the noun; inna raises the khabar; ẓanna puts both in naṣb."], "lvl": [{"ar": "ظَنَنْتُ الجَوَّ بَارِدًا", "en": "I thought the weather (was) cold"}, {"ar": "حَسِبْتُ الِامْتِحَانَ صَعْبًا", "en": "I thought the exam (was) hard"}, {"ar": "وَجَدْتُ الطَّرِيقَ إِلَى المَدْرَسَةِ طَوِيلَةً", "en": "I found the road to school (to be) long"}]}, {"t": "The na't (adjective)", "v": [{"k": "sent", "w": [["زَيْدٌ", "raf'", "r"], ["العَاقِلُ", "raf'", "r"], ["زَيْدًا", "naṣb", "n"], ["العَاقِلَ", "naṣb", "n"], ["زَيْدٍ", "khafḍ", "k"], ["العَاقِلِ", "khafḍ", "k"]], "n": "The adjective copies the noun's case and definiteness."}], "ar": "النَّعْتُ تَابِعٌ لِلْمَنْعُوتِ فِي رَفْعِهِ وَنَصْبِهِ وَخَفْضِهِ، وَتَعْرِيفِهِ وَتَنْكِيرِهِ، نَحْوُ: قَامَ زَيْدٌ العَاقِلُ، وَرَأَيْتُ زَيْدًا العَاقِلَ، وَمَرَرْتُ بِزَيْدٍ العَاقِلِ.", "en": "The adjective follows the described noun in its raf', naṣb and khafḍ, and in its definiteness or indefiniteness, like: Qāma Zaydun al-'āqilu, ra'aytu Zaydan al-'āqila, marartu bi-Zaydin al-'āqili.", "ex": ["Al-na't means the descriptive word. Grammatically it is a word, or a phrase standing for a word, that follows a noun and describes it.", "The adjective must agree with the noun it describes in four things: its case (raf', naṣb, khafḍ), and whether it is definite or indefinite. Change any one of the four in the noun and the adjective must change to match."], "lvl": [{"ar": "طَالِبٌ مُجْتَهِدٌ", "en": "a diligent student"}, {"ar": "رَأَيْتُ الطَّالِبَ المُجْتَهِدَ", "en": "I saw the diligent student"}, {"ar": "كَافَأَتِ المَدْرَسَةُ الطَّالِبَاتِ المُتَفَوِّقَاتِ", "en": "the school rewarded the outstanding students"}]}, {"t": "Definite and indefinite", "ar": "النَّكِرَةُ: كُلُّ اسْمٍ شَائِعٍ فِي جِنْسِهِ، لَا يَخْتَصُّ بِهِ وَاحِدٌ دُونَ آخَرَ. وَتَقْرِيبُهُ: كُلُّ مَا صَلَحَ دُخُولُ الأَلِفِ وَاللَّامِ عَلَيْهِ، نَحْوُ: الرَّجُلِ، وَالفَرَسِ. وَالمَعْرِفَةُ خَمْسَةُ أَشْيَاءَ: الِاسْمُ المُضْمَرُ، نَحْوُ: أَنَا، وَأَنْتَ. وَالِاسْمُ العَلَمُ، نَحْوُ: زَيْدٍ، وَمَكَّةَ. وَالِاسْمُ المُبْهَمُ، نَحْوُ: هَذَا، وَهَذِهِ، وَهَؤُلَاءِ. وَالِاسْمُ الَّذِي فِيهِ الأَلِفُ وَاللَّامُ، نَحْوُ: الرَّجُلِ، وَالغُلَامِ. وَمَا أُضِيفَ إِلَى وَاحِدٍ مِنْ هَذِهِ الأَرْبَعَةِ.", "en": "The indefinite is every noun which is general in its class and not specific to one over another. To approximate: every noun that can take alif-lām, like al-rajul, al-faras. The definite is five things: the implicit noun (anā, anta), the proper noun (Zayd, Makkah), the ambiguous noun (hādhā, hādhihi, hā'ulā'i), the noun with alif-lām (al-rajul, al-ghulām), and whatever is attached (muḍāf) to one of these four.", "ex": ["The indefinite noun is one whose meaning is shared by every member of its class, with nothing to single one out — this is why it accepts the definite article al-.", "The five definite types form a ladder: the pronoun and proper noun are definite by nature, the demonstrative and relative noun point to something specific, the al- noun is made definite by the article, and anything attached (muḍāf) to one of these four becomes definite through that attachment."], "v": [{"k": "chips", "items": ["ضَمِير", "عَلَم", "اسْم إِشَارَة", "فِيهِ الـ", "مُضَاف إِلَى وَاحِدٍ مِنْهَا"], "tone": "r", "t": "Five definite types"}, {"k": "chips", "items": ["كُلُّ مَا يَقْبَلُ الـ: رَجُل، فَرَس"], "tone": "x", "t": "Indefinite (test)"}], "lvl": [{"ar": "وَلَدٌ / الوَلَدُ", "en": "a boy / the boy"}, {"ar": "هَذَا الكِتَابُ مُفِيدٌ", "en": "this book is useful — demonstrative"}, {"ar": "كِتَابُ الأُسْتَاذِ عَلَى الطَّاوِلَةِ", "en": "the teacher's book is on the table — definite by iḍāfah"}]}, {"t": "The 'aṭf (conjunction)", "v": [{"k": "chips", "items": ["وَ", "فَ", "ثُمَّ", "أَوْ", "أَمْ", "إِمَّا", "بَلْ", "لَا", "لَكِنْ", "حَتَّى"], "tone": "x", "t": "Ten letters"}, {"k": "sent", "w": [["زَيْدٌ", "raf'", "r"], ["وَعَمْرٌو", "joined · raf'", "r"]], "n": "The joined word copies the case."}], "ar": "حُرُوفُ العَطْفِ عَشَرَةٌ، وَهِيَ: الوَاوُ، وَالفَاءُ، وَثُمَّ، وَأَوْ، وَأَمْ، وَإِمَّا، وَبَلْ، وَلَا، وَلَكِنْ، وَحَتَّى فِي بَعْضِ المَوَاضِعِ. فَإِنْ عَطَفْتَ بِهَا عَلَى مَرْفُوعٍ رَفَعْتَ، أَوْ عَلَى مَنْصُوبٍ نَصَبْتَ، أَوْ عَلَى مَخْفُوضٍ خَفَضْتَ، أَوْ عَلَى مَجْزُومٍ جَزَمْتَ، تَقُولُ: قَامَ زَيْدٌ وَعَمْرٌو، وَرَأَيْتُ زَيْدًا وَعَمْرًا، وَمَرَرْتُ بِزَيْدٍ وَعَمْرٍو، وَزَيْدٌ لَمْ يَقُمْ وَلَمْ يَقْعُدْ.", "en": "The letters of conjunction are ten: wāw, fā', thumma, aw, am, immā, bal, lā, lākin, and in some places ḥattā. If you conjoin to a word in raf', the conjoined word takes raf'; to naṣb, naṣb; to khafḍ, khafḍ; to jazm, jazm. Examples: Qāma Zaydun wa 'Amrun; ra'aytu Zaydan wa 'Amran; marartu bi-Zaydin wa 'Amrin; Zaydun lam yaqum wa lam yaq'ud.", "ex": ["Linguistically 'aṭf means to incline towards something, as one person inclines towards another out of compassion — grammatically, the conjoined word inclines towards, and shares the case of, the word before the particle.", "The commentary separates a second use for wāw called 'aṭf al-bayān (the conjunction of clarification): a word placed after another to clarify or specify it, agreeing with it in definiteness, as in “Muḥammad, your father, came”, where “your father” clarifies who Muḥammad is."], "lvl": [{"ar": "زَيْدٌ وَعَمْرٌو", "en": "Zayd and 'Amr"}, {"ar": "قَرَأْتُ الكِتَابَ ثُمَّ لَخَّصْتُهُ", "en": "I read the book then summarised it"}, {"ar": "إِمَّا أَنْ تَجْتَهِدَ وَإِمَّا أَنْ تَنْدَمَ", "en": "either you strive, or you will regret it"}]}, {"t": "The tawkīd (emphasis)", "v": [{"k": "chips", "items": ["النَّفْس", "العَيْن", "كُلّ", "أَجْمَع", "أَكْتَع", "أَبْتَع", "أَبْصَع"], "tone": "x", "t": "Emphasis words"}, {"k": "sent", "w": [["قَامَ زَيْدٌ", "x", "x"], ["نَفْسُهُ", "emphasis · raf'", "r"]], "n": null}], "ar": "التَّوْكِيدُ تَابِعٌ لِلْمُؤَكَّدِ فِي رَفْعِهِ وَنَصْبِهِ وَخَفْضِهِ وَتَعْرِيفِهِ. وَيَكُونُ بِأَلْفَاظٍ مَعْلُومَةٍ، وَهِيَ: النَّفْسُ، وَالعَيْنُ، وَكُلٌّ، وَأَجْمَعُ، وَتَوَابِعُ أَجْمَعَ، وَهِيَ: أَكْتَعُ، وَأَبْتَعُ، وَأَبْصَعُ. تَقُولُ: قَامَ زَيْدٌ نَفْسُهُ، وَرَأَيْتُ القَوْمَ كُلَّهُمْ، وَمَرَرْتُ بِالقَوْمِ أَجْمَعِينَ.", "en": "The emphatic word follows the emphasised word in raf', naṣb, khafḍ and definiteness. It is made with known words: nafs, 'ayn, kull, ajma', and the followers of ajma': akta', abta', abṣa'. Examples: Qāma Zaydun nafsuhu; ra'aytu al-qawma kullahum; marartu bil-qawmi ajma'īna.", "ex": ["Tawkīd literally means to strengthen — like repeating a claim to reinforce it. Grammatically it strengthens a preceding word by removing any doubt that the word applies fully or was mentioned correctly.", "There are two types: verbal emphasis, which simply repeats the same word or phrase, and emphasis through meaning, made with nafs, 'ayn, kull, and the words that follow ajma' (akta', abta', abṣa')."], "lvl": [{"ar": "جَاءَ زَيْدٌ نَفْسُهُ", "en": "Zayd himself came"}, {"ar": "حَضَرَ الطُّلَّابُ كُلُّهُمْ", "en": "all the students attended"}, {"ar": "نَجَحَ الفَرِيقُ كُلُّهُ فِي المُبَارَاةِ أَجْمَعَ", "en": "the whole team altogether succeeded in the match"}]}, {"t": "The badal (substitution)", "v": [{"k": "tree", "root": "البَدَل", "kids": [["كُلٌّ مِنْ كُلّ", "whole for whole", "r"], ["بَعْضٌ مِنْ كُلّ", "part for whole", "n"], ["اشْتِمَال", "inclusion", "k"], ["غَلَط", "mistake", "j"]]}], "ar": "إِذَا أُبْدِلَ اسْمٌ مِنِ اسْمٍ، أَوْ فِعْلٌ مِنْ فِعْلٍ: تَبِعَهُ فِي جَمِيعِ إِعْرَابِهِ. وَهُوَ أَرْبَعَةُ أَقْسَامٍ: بَدَلُ الشَّيْءِ مِنَ الشَّيْءِ، وَبَدَلُ البَعْضِ مِنَ الكُلِّ، وَبَدَلُ الِاشْتِمَالِ، وَبَدَلُ الغَلَطِ. تَقُولُ: قَامَ زَيْدٌ أَخُوكَ، وَأَكَلْتُ الرَّغِيفَ ثُلُثَهُ، وَنَفَعَنِي زَيْدٌ عِلْمُهُ، وَرَأَيْتُ زَيْدًا الفَرَسَ، أَرَدْتَ أَنْ تَقُولَ: الفَرَسَ، فَغَلِطْتَ، فَأَبْدَلْتَ زَيْدًا مِنْهُ.", "en": "If a noun is substituted for a noun, or a verb for a verb, the substitute follows it in all of its i'rāb (case). It has four types: the whole for the whole; a part for the whole; inclusion; and mistake. Examples: Qāma Zaydun akhūka; akaltu al-raghīfa thuluthahu; nafa'anī Zaydun 'ilmuhu; ra'aytu Zaydan al-farasa. You meant to say “the horse”, made a mistake, and so substituted Zayd with it.", "ex": ["The substitute takes the same i'rāb as the word it replaces (raf', naṣb, khafḍ or jazm). Four types: whole-for-whole, part-for-whole, inclusion, and mistake.", "Mistake: you intended to say “the horse” (al-farasa) but said “Zayd” first, so you correct yourself and put al-farasa in Zayd's place."], "s": 0, "lvl": [{"ar": "جَاءَ أَخِي خَالِدٌ", "en": "my brother, Khālid, came — whole for whole"}, {"ar": "أَكَلْتُ الرَّغِيفَ نِصْفَهُ", "en": "I ate the loaf, half of it — part for whole"}, {"ar": "أَعْجَبَنِي الكِتَابُ أُسْلُوبُهُ وَأَفْكَارُهُ", "en": "the book impressed me — its style and ideas — inclusion"}]}, {"t": "The fourteen manṣūbāt", "v": [{"k": "chips", "items": ["المَفْعُول بِهِ", "المَصْدَر", "ظَرْف الزَّمَان", "ظَرْف المَكَان", "الحَال", "التَّمْيِيز", "المُسْتَثْنَى", "اسْم لَا", "المُنَادَى", "المَفْعُول مِنْ أَجْلِهِ", "المَفْعُول مَعَهُ", "خَبَر كَانَ", "اسْم إِنَّ", "التَّابِع"], "tone": "n", "t": ""}], "ar": "المَنْصُوبَاتُ أَرْبَعَةَ عَشَرَ، وَهِيَ: المَفْعُولُ بِهِ، وَالمَصْدَرُ، وَظَرْفُ الزَّمَانِ، وَظَرْفُ المَكَانِ، وَالحَالُ، وَالتَّمْيِيزُ، وَالمُسْتَثْنَى، وَاسْمُ لَا، وَالمُنَادَى، وَالمَفْعُولُ مِنْ أَجْلِهِ، وَالمَفْعُولُ مَعَهُ، وَخَبَرُ كَانَ وَأَخَوَاتِهَا، وَاسْمُ إِنَّ وَأَخَوَاتِهَا، وَالتَّابِعُ لِلْمَنْصُوبِ، وَهُوَ أَرْبَعَةُ أَشْيَاءَ: النَّعْتُ، وَالعَطْفُ، وَالتَّوْكِيدُ، وَالبَدَلُ.", "en": "The nouns in naṣb are fourteen in your Arabic matn: the direct object; the maṣdar; the adverb of time; the adverb of place; the ḥāl; the tamyīz; the exception; the noun of lā; the vocative; the object of cause; the object of accompaniment; the khabar of kāna and her sisters; the noun of inna and her sisters; and the follower of a manṣūb, which is four: adjective, conjunction, emphasis, substitution. (The English translation PDF says “fifteen” but lists the same items.)", "ex": ["The commentary then takes these one at a time, in the order of the matn. The last two governor-based ones were already covered under the marfū' chapters.", "Check: your Arabic PDF says fourteen; the English PDF says fifteen. The list itself is the same, so the difference is in the number, not the items."], "lvl": [{"ar": "أَكَلَ زَيْدٌ تُفَّاحَةً", "en": "Zayd ate an apple — object"}, {"ar": "سَافَرْتُ صَبَاحًا إِلَى المَدِينَةِ", "en": "I travelled in the morning to the city"}, {"ar": "احْتَرَمْتُ المُعَلِّمَ تَقْدِيرًا لِجُهُودِهِ", "en": "I respected the teacher out of regard for his efforts"}]}, {"t": "The maf'ūl bihi", "v": [{"k": "sent", "w": [["ضَرَبْتُ", "verb", "x"], ["زَيْدًا", "object · naṣb", "n"]], "n": "What the action falls on."}], "ar": "المَفْعُولُ بِهِ هُوَ الِاسْمُ المَنْصُوبُ الَّذِي يَقَعُ عَلَيْهِ الفِعْلُ، نَحْوُ: ضَرَبْتُ زَيْدًا، وَرَكِبْتُ الفَرَسَ. وَهُوَ قِسْمَانِ: ظَاهِرٌ وَمُضْمَرٌ.", "en": "The direct object is the noun in naṣb upon which the verb is enacted, like: ḍarabtu Zaydan and rakibtu al-farasa. It is of two types: apparent and implicit (attached, like ـني، ـك، ـه, or detached, like إِيَّايَ، إِيَّاكَ، إِيَّاهُ).", "ex": ["A sentence can include a verb, its doer, and its object together, as in “Maḥmūd cut the branch”, where “the branch” is the maf'ūl bihi.", "When the doer is dropped and only the verb and object remain, the object takes over the doer's raf' — this is exactly the passive-subject chapter covered earlier in this app."], "lvl": [{"ar": "قَرَأَ الوَلَدُ الدَّرْسَ", "en": "the boy read the lesson"}, {"ar": "سَاعَدَتِ الأُمُّ ابْنَتَهَا فِي الوَاجِبِ", "en": "the mother helped her daughter with the homework"}, {"ar": "قَابَلْتُ صَدِيقِي القَدِيمَ بَعْدَ سَنَوَاتٍ طَوِيلَةٍ", "en": "I met my old friend after long years away"}]}, {"t": "The maṣdar", "v": [{"k": "sent", "w": [["ضَرَبَ", "1 · past", "x"], ["يَضْرِبُ", "2 · present", "x"], ["ضَرْبًا", "3 · maṣdar · naṣb", "n"]], "n": "The maṣdar is the third form."}, {"k": "sent", "w": [["قَتَلْتُهُ قَتْلًا", "lafẓī · same letters", "n"], ["جَلَسْتُ قُعُودًا", "ma'nawī · same meaning", "n"]]}], "ar": "الـمَصْدَرُ هُوَ الِاسْمُ الـمَنْصُوبُ الَّذِي يَجِيءُ ثَالِثًا فِي تَصْرِيفِ الفِعْلِ، نَحْوُ: ضَرَبَ يَضْرِبُ ضَرْبًا. وَهُوَ قِسْمَانِ: لَفْظِيٌّ، وَمَعْنَوِيٌّ. فَإِنْ وَافَقَ لَفْظُهُ لَفْظَ فِعْلِهِ فَهُوَ لَفْظِيٌّ، نَحْوُ: قَتَلْتُهُ قَتْلًا. وَإِنْ وَافَقَ مَعْنَى فِعْلِهِ دُونَ لَفْظِهِ فَهُوَ مَعْنَوِيٌّ، نَحْوُ: جَلَسْتُ قُعُودًا، وَقُمْتُ وُقُوفًا.", "en": "The maṣdar is the noun in naṣb which comes third when conjugating the verb, like: ḍaraba, yaḍribu, ḍarban. It is of two types: written (lafẓī) if its letters agree with its verb (qataltuhu qatlan, “I killed him killing”), and abstract (ma'nawī) if only the meaning agrees (jalastu qu'ūdan, qumtu wuqūfan).", "ex": ["Conjugate a verb in order: past (ḍaraba), present (yaḍribu), then the maṣdar (ḍarban).", "Two types: <b>lafẓī</b> (same letters as the verb: qataltuhu qatlan) and <b>ma'nawī</b> (same meaning, different letters: jalastu qu'ūdan)."], "lvl": [{"ar": "فَهِمْتُ فَهْمًا", "en": "I understood, an understanding"}, {"ar": "شَكَرْتُهُ شُكْرًا جَزِيلًا", "en": "I thanked him greatly"}, {"ar": "اِجْتَهَدَ الطَّالِبُ اجْتِهَادًا لَمْ يَسْبِقْ لَهُ مِثِيلٌ", "en": "the student strove with unprecedented effort"}]}, {"t": "Ẓarf of time", "v": [{"k": "chips", "items": ["اليَوْمَ", "اللَّيْلَةَ", "غُدْوَةً", "بُكْرَةً", "سَحَرًا", "غَدًا", "عَتَمَةً", "صَبَاحًا", "مَسَاءً", "أَبَدًا", "أَمَدًا", "حِينًا"], "tone": "n", "t": "Time words = في + time"}], "ar": "ظَرْفُ الزَّمَانِ هُوَ اسْمُ الزَّمَانِ الـمَنْصُوبُ بِتَقْدِيرِ «فِي»، نَحْوُ: اليَوْمَ، وَاللَّيْلَةَ، وَغُدْوَةً، وَبُكْرَةً، وَسَحَرًا، وَغَدًا، وَعَتَمَةً، وَصَبَاحًا، وَمَسَاءً، وَأَبَدًا، وَأَمَدًا، وَحِينًا، وَمَا أَشْبَهَ ذَلِكَ.", "en": "The adverb of time is a noun of time in naṣb with the implied meaning of “in” or “during”: today, tonight, early morning, early daytime, late night, tomorrow, early night, morning, evening, always, long-term, a while, and the like.", "ex": ["Ẓarf literally means “container”: the action happens inside that time.", "Any word of time can be made manṣūb this way, whether specific (like ḍuḥā) or unspecific (like waqt, sā'ah, ḥīn)."], "lvl": [{"ar": "صَبَاحًا", "en": "in the morning"}, {"ar": "أَدْرُسُ لَيْلًا", "en": "I study at night"}, {"ar": "سَافَرْتُ إِلَى بَلَدِي صَبَاحَ يَوْمِ الجُمُعَةِ", "en": "I travelled to my country on Friday morning"}]}, {"t": "Ẓarf of place", "v": [{"k": "chips", "items": ["أَمَامَ", "خَلْفَ", "قُدَّامَ", "وَرَاءَ", "فَوْقَ", "تَحْتَ", "عِنْدَ", "مَعَ", "إِزَاءَ", "حِذَاءَ", "تِلْقَاءَ", "ثَمَّ", "هُنَا"], "tone": "n", "t": "Place words = في + place"}], "ar": "ظَرْفُ الـمَكَانِ هُوَ اسْمُ الـمَكَانِ الـمَنْصُوبُ بِتَقْدِيرِ «فِي»، نَحْوُ: أَمَامَ، وَخَلْفَ، وَقُدَّامَ، وَوَرَاءَ، وَفَوْقَ، وَتَحْتَ، وَعِنْدَ، وَمَعَ، وَإِزَاءَ، وَحِذَاءَ، وَتِلْقَاءَ، وَهُنَا، وَثَمَّ، وَمَا أَشْبَهَ ذَلِكَ.", "en": "The adverb of place is a noun of location in naṣb with the implied meaning of “in”: in front, behind, before, after, above, under, with/by, opposite, close to, facing, there, here, and the like.", "ex": ["The author treats time and place as two chapters because their rulings are close. Example: “I sat in front of the teacher”; “in front of” is manṣūb as a ẓarf."], "lvl": [{"ar": "أَمَامَ البَيْتِ", "en": "in front of the house"}, {"ar": "جَلَسْتُ تَحْتَ الشَّجَرَةِ", "en": "I sat under the tree"}, {"ar": "وَقَفَ الحَارِسُ خَلْفَ البَابِ طَوَالَ اللَّيْلِ", "en": "the guard stood behind the door all night"}]}, {"t": "The ḥāl (situational)", "v": [{"k": "sent", "w": [["جَاءَ", "x", "x"], ["زَيْدٌ", "doer · raf'", "r"], ["رَاكِبًا", "ḥāl · naṣb", "n"]], "n": "How? Indefinite, after complete speech, owner definite."}], "ar": "الحَالُ هُوَ الِاسْمُ الـمَنْصُوبُ الـمُفَسِّرُ لِمَا انْبَهَمَ مِنَ الهَيْئَاتِ، نَحْوُ: جَاءَ زَيْدٌ رَاكِبًا، وَرَكِبْتُ الفَرَسَ مُسْرَجًا، وَلَقِيتُ عَبْدَ اللهِ رَاكِبًا، وَمَا أَشْبَهَ ذَلِكَ. وَلَا يَكُونُ الحَالُ إِلَّا نَكِرَةً، وَلَا يَكُونُ إِلَّا بَعْدَ تَمَامِ الكَلَامِ، وَلَا يَكُونُ صَاحِبُهَا إِلَّا مَعْرِفَةً.", "en": "The situational is the noun in naṣb which explains an ambiguous state, like: Zayd came riding; I rode the horse saddled; I met 'Abdullāh riding. The ḥāl is always indefinite, only comes after a complete sentence, and its owner is always definite.", "ex": ["Linguistically ḥāl is the condition of a person. Grammatically it is a surplus (faḍlah) noun in naṣb that tells you <b>how</b> the action happened.", "Test: ask “in what state?” Zayd came... riding."], "lvl": [{"ar": "جَاءَ زَيْدٌ رَاكِبًا", "en": "Zayd came riding"}, {"ar": "شَرِبْتُ المَاءَ بَارِدًا", "en": "I drank the water cold"}, {"ar": "عَادَ الجُنُودُ مِنَ المَعْرَكَةِ مُنْتَصِرِينَ فَرِحِينَ", "en": "the soldiers returned from battle victorious, joyful"}]}, {"t": "The tamyīz (distinctive)", "v": [{"k": "sent", "w": [["اشْتَرَيْتُ", "x", "x"], ["عِشْرِينَ", "number", "x"], ["غُلَامًا", "tamyīz · naṣb", "n"]], "n": "Twenty of what? The tamyīz clears up the thing."}], "ar": "التَّمْيِيزُ هُوَ الِاسْمُ الـمَنْصُوبُ الـمُفَسِّرُ لِمَا انْبَهَمَ مِنَ الذَّوَاتِ، نَحْوُ: تَصَبَّبَ زَيْدٌ عَرَقًا، وَتَفَقَّأَ بَكْرٌ شَحْمًا، وَطَابَ مُحَمَّدٌ نَفْسًا، وَاشْتَرَيْتُ عِشْرِينَ غُلَامًا، وَمَلَكْتُ تِسْعِينَ نَعْجَةً، وَزَيْدٌ أَكْرَمُ مِنْكَ أَبًا، وَأَجْمَلُ مِنْكَ وَجْهًا. وَلَا يَكُونُ إِلَّا نَكِرَةً، وَلَا يَكُونُ إِلَّا بَعْدَ تَمَامِ الكَلَامِ.", "en": "The distinctive is the noun in naṣb which explains an ambiguous thing, like: Zayd dripped with sweat; Bakr became full of fat; Muḥammad is good in soul; I bought twenty slaves; I owned ninety ewes; Zayd is more generous than you as a father, and more handsome in face. It is always indefinite and only comes after a complete sentence.", "ex": ["The tamyīz clears up an ambiguous noun rather than an ambiguous state — compare “twenty” (ambiguous: twenty of what?) with the ḥāl's “riding” (a state, not a thing).", "It is always indefinite and always comes after the sentence is otherwise complete, matching the same two conditions as the ḥāl."], "lvl": [{"ar": "عِنْدِي عِشْرُونَ كِتَابًا", "en": "I have twenty books"}, {"ar": "اِزْدَادَ الوَلَدُ طُولًا", "en": "the boy grew in height"}, {"ar": "اِمْتَلَأَ قَلْبُهُ سُرُورًا يَوْمَ نَجَاحِهِ", "en": "his heart filled with joy on the day of his success"}]}, {"t": "Istithnā' with illā", "v": [{"k": "ba", "rows": [["Complete + positive", [["قَامَ القَوْمُ إِلَّا", "x"], ["زَيْدًا · naṣb", "n"]]], ["Complete + negative", [["مَا قَامَ القَوْمُ إِلَّا", "x"], ["زَيْدٌ or زَيْدًا", "r"]]], ["Deficient", [["مَا قَامَ إِلَّا", "x"], ["زَيْدٌ · by governor", "r"]]]], "n": null}], "ar": "حُرُوفُ الِاسْتِثْنَاءِ ثَمَانِيَةٌ، وَهِيَ: إِلَّا، وَغَيْرُ، وَسِوَى، وَسُوَى، وَسَوَاءٌ، وَخَلَا، وَعَدَا، وَحَاشَا. فَالـمُسْتَثْنَى بِإِلَّا يُنْصَبُ إِذَا كَانَ الكَلَامُ تَامًّا مُوجَبًا، نَحْوُ: قَامَ القَوْمُ إِلَّا زَيْدًا، وَخَرَجَ النَّاسُ إِلَّا عَمْرًا. وَإِنْ كَانَ الكَلَامُ مَنْفِيًّا تَامًّا جَازَ فِيهِ البَدَلُ وَالنَّصْبُ عَلَى الِاسْتِثْنَاءِ، نَحْوُ: مَا قَامَ القَوْمُ إِلَّا زَيْدٌ وَإِلَّا زَيْدًا. وَإِنْ كَانَ الكَلَامُ نَاقِصًا كَانَ عَلَى حَسَبِ العَوَامِلِ، نَحْوُ: مَا قَامَ إِلَّا زَيْدٌ، وَمَا ضَرَبْتُ إِلَّا زَيْدًا، وَمَا مَرَرْتُ إِلَّا بِزَيْدٍ.", "en": "The exception particles are eight: illā, ghayr, siwā, suwā, sawā', khalā, 'adā, ḥāshā. After illā, the exception is naṣb if the speech is complete and positive (“the people stood except Zayd”). If complete and negative, either substitution or naṣb is allowed. If the speech is deficient, its case depends on the governors present.", "ex": ["Istithnā' literally means removal. It is taking something out of what came before the particle: “the students passed except Āmir”; without illā, Āmir would be part of “the students”.", "Complete = the excluded-from group is mentioned. Negative = the sentence has a negation."], "lvl": [{"ar": "حَضَرَ الطُّلَّابُ إِلَّا وَاحِدًا", "en": "the students attended except one"}, {"ar": "مَا نَجَحَ أَحَدٌ إِلَّا خَالِدٌ", "en": "no one succeeded except Khālid"}, {"ar": "قَرَأْتُ كُلَّ كُتُبِ المَكْتَبَةِ إِلَّا كِتَابًا وَاحِدًا", "en": "I read every book in the library except one"}]}, {"t": "Istithnā' with the other particles", "v": [{"k": "map", "rows": [["غَيْر سِوَى سُوَى سَوَاء", "always", ["khafḍ"], "k"], ["خَلَا عَدَا حَاشَا", "either", ["naṣb", "khafḍ"], "n"]], "n": null}], "ar": "وَالـمُسْتَثْنَى بِغَيْرٍ وَسِوَى وَسُوَى وَسَوَاءٍ مَجْرُورٌ لَا غَيْرُ. وَالـمُسْتَثْنَى بِخَلَا وَعَدَا وَحَاشَا يَجُوزُ نَصْبُهُ وَجَرُّهُ، نَحْوُ: قَامَ القَوْمُ خَلَا زَيْدًا وَزَيْدٍ، وَعَدَا عَمْرًا وَعَمْرٍو، وَحَاشَا بَكْرًا وَبَكْرٍ.", "en": "The exception after ghayr, siwā, suwā and sawā' is always in jarr. After khalā, 'adā and ḥāshā it can be in naṣb or jarr, like: the people stood except Zayd (either case), and 'Amr (either case).", "ex": ["Memorise it as two groups: <b>ghayr, siwā, suwā, sawā'</b> always jarr; <b>khalā, 'adā, ḥāshā</b> either naṣb or jarr."], "lvl": [{"ar": "حَضَرَ القَوْمُ غَيْرَ زَيْدٍ", "en": "the people attended, other than Zayd"}, {"ar": "سَافَرَ الجَمِيعُ خَلَا صَدِيقِي", "en": "everyone travelled except my friend"}, {"ar": "أَنْهَى الفَرِيقُ تَدْرِيبَهُ سِوَى لَاعِبٍ وَاحِدٍ مُصَابٍ", "en": "the team finished training except for one injured player"}]}, {"t": "The noun of lā", "v": [{"k": "ba", "rows": [["Touches noun, not repeated", [["لَا", "x"], ["رَجُلَ · naṣb, no tanwīn", "n"], ["فِي الدَّارِ", "x"]]], ["Doesn't touch: repeat lā", [["لَا فِي الدَّارِ", "x"], ["رَجُلٌ · raf'", "r"], ["وَلَا امْرَأَةٌ", "r"]]]], "n": null}], "ar": "اعْلَمْ أَنَّ «لَا» تَنْصِبُ النَّكِرَاتِ بِغَيْرِ تَنْوِينٍ إِذَا بَاشَرَتِ النَّكِرَةَ وَلَمْ تَتَكَرَّرْ لَا، نَحْوُ: لَا رَجُلَ فِي الدَّارِ. فَإِنْ لَمْ تُبَاشِرْهَا وَجَبَ الرَّفْعُ وَوَجَبَ تَكْرَارُ لَا، نَحْوُ: لَا فِي الدَّارِ رَجُلٌ وَلَا امْرَأَةٌ. فَإِنْ تَكَرَّرَتْ لَا جَازَ إِعْمَالُهَا وَإِلْغَاؤُهَا، فَإِنْ شِئْتَ قُلْتَ: لَا رَجُلَ فِي الدَّارِ وَلَا امْرَأَةَ، وَإِنْ شِئْتَ قُلْتَ: لَا رَجُلٌ فِي الدَّارِ وَلَا امْرَأَةٌ.", "en": "Know that lā puts indefinite nouns in naṣb without tanwīn if it directly touches the noun and lā is not repeated: lā rajula fī al-dār. If it does not touch it, raf' is obligatory and lā must be repeated: lā fī al-dāri rajulun wa lā imra'atun. If lā is repeated, it may either work or not work.", "ex": ["The commentary explains that this lā (of general negation) behaves like inna: it puts its noun in naṣb and its khabar in raf', and it negates the entire class the noun refers to, not just one member of it.", "This only applies when four conditions are met: the noun is indefinite, directly attached to lā, the khabar is also indefinite, and lā itself is not repeated. If lā is repeated, or something comes between lā and its noun, the rule no longer applies (see the earlier example with wa lā imra'atun)."], "lvl": [{"ar": "لَا رَجُلَ فِي الدَّارِ", "en": "there is no man in the house"}, {"ar": "لَا طَالِبَ كَسْلَانَ فِي صَفِّنَا", "en": "there is no lazy student in our class"}, {"ar": "لَا شَكَّ أَنَّ الِاجْتِهَادَ طَرِيقُ النَّجَاحِ", "en": "there is no doubt that diligence is the path to success"}]}, {"t": "The munādā (vocative)", "v": [{"k": "map", "rows": [["يَا زَيْدُ", "single name", ["ḍammah · built"], "r"], ["يَا رَجُلُ", "intended indefinite", ["ḍammah · built"], "r"], ["يَا رَجُلًا", "unintended indefinite", ["naṣb"], "n"], ["يَا عَبْدَ اللهِ", "muḍāf", ["naṣb"], "n"], ["يَا طَالِعًا جَبَلًا", "resembles muḍāf", ["naṣb"], "n"]], "n": null}], "ar": "الـمُنَادَى خَمْسَةُ أَنْوَاعٍ: الـمُفْرَدُ العَلَمُ، وَالنَّكِرَةُ الـمَقْصُودَةُ، وَالنَّكِرَةُ غَيْرُ الـمَقْصُودَةِ، وَالمُضَافُ، وَالمُشَبَّهُ بِالمُضَافِ. فَأَمَّا الـمُفْرَدُ العَلَمُ وَالنَّكِرَةُ الـمَقْصُودَةُ فَيُبْنَيَانِ عَلَى الضَّمِّ مِنْ غَيْرِ تَنْوِينٍ، نَحْوُ: يَا زَيْدُ، وَيَا رَجُلُ. وَالثَّلَاثَةُ البَاقِيَةُ مَنْصُوبَةٌ لَا غَيْرُ.", "en": "The called is of five types: the single proper name, the indefinite intended, the indefinite unintended, the muḍāf, and what resembles the muḍāf. The single proper name and the intended indefinite are built on ḍammah without tanwīn (yā Zaydu, yā rajulu). The other three are always in naṣb.", "ex": ["Munādā means seeking someone's approach using yā or one of its sisters, e.g. “O Ibrāhīm, understand!”.", "Build (mabnī) means the ending is fixed on ḍammah, not moved by a governor."], "lvl": [{"ar": "يَا زَيْدُ", "en": "O Zayd"}, {"ar": "يَا طَالِبًا مُجْتَهِدًا أَبْشِرْ", "en": "O diligent student, rejoice"}, {"ar": "يَا رَاكِبَ السَّيَّارَةِ انْتَبِهْ لِلطَّرِيقِ", "en": "O driver of the car, watch the road"}]}, {"t": "The maf'ūl min ajlihi", "v": [{"k": "sent", "w": [["قَامَ زَيْدٌ", "x", "x"], ["إِجْلَالًا", "reason · naṣb", "n"], ["لِعَمْرٍو", "x", "x"]], "n": "Why?"}], "ar": "الـمَفْعُولُ مِنْ أَجْلِهِ: هُوَ الِاسْمُ الـمَنْصُوبُ الَّذِي يُذْكَرُ بَيَانًا لِسَبَبِ وُقُوعِ الفِعْلِ. نَحْوُ قَوْلِكَ: قَامَ زَيْدٌ إِجْلَالًا لِعَمْرٍو، وَقَصَدْتُكَ ابْتِغَاءَ مَعْرُوفِكَ.", "en": "The causative object is the noun in naṣb mentioned to explain the reason the action happened: Zayd stood out of reverence for 'Amr; I sought you out desiring your favour.", "ex": ["The commentary's own list of the manṣūbāt gives “an object of reason” as an example: the teacher scolded the student ta'dīban, “to instil discipline” — the maṣdar ta'dīban explains why the scolding happened.", "It answers “why?” and is itself always a maṣdar (a verbal noun), never a plain noun standing for the reason."], "lvl": [{"ar": "وَقَفْتُ احْتِرَامًا", "en": "I stood out of respect"}, {"ar": "سَافَرْتُ طَلَبًا لِلْعِلْمِ", "en": "I travelled seeking knowledge"}, {"ar": "بَذَلَ المُعَلِّمُ جُهْدَهُ رَغْبَةً فِي نَجَاحِ طُلَّابِهِ", "en": "the teacher gave his effort out of desire for his students' success"}]}, {"t": "The maf'ūl ma'ahu", "v": [{"k": "sent", "w": [["جَاءَ الأَمِيرُ", "x", "x"], ["وَ", "= with", "x"], ["الجَيْشَ", "accompanied · naṣb", "n"]], "n": null}], "ar": "الـمَفْعُولُ مَعَهُ هُوَ الِاسْمُ الـمَنْصُوبُ الَّذِي يُذْكَرُ لِبَيَانِ مَنْ فُعِلَ مَعَهُ الفِعْلُ، نَحْوُ: جَاءَ الأَمِيرُ وَالجَيْشَ، وَاسْتَوَى الـمَاءُ وَالخَشَبَةَ.", "en": "The object of accompaniment is the noun in naṣb mentioned to explain who or what participated in the action: the leader came with the army; the water became level with the wood.", "ex": ["Definition from the commentary: a noun, surplus to the sentence, manṣūb because of a verb (or verb-like word), showing what accompanied the action, and coming after a wāw that means “with”."], "lvl": [{"ar": "سَافَرَ المُدِيرُ وَالوَفْدَ", "en": "the director travelled with the delegation"}, {"ar": "مَشَيْتُ وَالسَّاحِلَ", "en": "I walked along the coast"}, {"ar": "اِسْتَيْقَظَ الفَلَّاحُ وَطُلُوعَ الشَّمْسِ لِيَبْدَأَ عَمَلَهُ", "en": "the farmer woke with the sunrise to start his work"}]}, {"t": "Makhfūḍāt: the khafḍ chapter", "v": [{"k": "tree", "root": "المَخْفُوضَات", "kids": [["بِالحَرْف", "by a particle", "k"], ["بِالإِضَافَة", "by iḍāfah", "k"], ["التَّابِع", "follower", "k"]]}, {"k": "chips", "items": ["مِنْ", "إِلَى", "عَنْ", "عَلَى", "فِي", "رُبَّ", "بِ", "كَ", "لِ", "وَ", "تَ", "مُذْ", "مُنْذُ"], "tone": "k", "t": "Particles"}], "ar": "الـمَخْفُوضَاتُ ثَلَاثَةُ أَقْسَامٍ: مَخْفُوضٌ بِالحَرْفِ، وَمَخْفُوضٌ بِالإِضَافَةِ، وَتَابِعٌ لِلْمَخْفُوضِ. فَأَمَّا الـمَخْفُوضُ بِالحَرْفِ: فَهُوَ مَا يُخْفَضُ بِمِنْ، وَإِلَى، وَعَنْ، وَعَلَى، وَفِي، وَرُبَّ، وَالبَاءِ، وَالكَافِ، وَاللَّامِ، وَبِحُرُوفِ القَسَمِ ـ وَهِيَ: الوَاوُ، وَالبَاءُ، وَالتَّاءُ ـ، وَبِوَاوِ رُبَّ، وَبِمُذْ، وَمُنْذُ.", "en": "The nouns in khafḍ are three types: khafḍ by a particle, khafḍ by the possessive construction (iḍāfah), and a follower of a noun in khafḍ. Khafḍ by a particle is by: min, ilā, 'an, 'alā, fī, rubba, bā, kāf, lām, the oath letters wāw, bā and tā, the wāw of rubba, and mudh and mundh.", "ex": ["Khafḍ comes from a particle, from iḍāfah, or by following a majrūr noun (the follower was covered under the marfū' chapters).", "From the commentary: <b>rubba</b> is for reduction and only makes an explicit indefinite noun majrūr (“few a noble man have I met”). Of the oath letters, <b>wāw</b> is used only with a noun (“By Allah”), <b>bā</b> with a noun or pronoun, and <b>tā</b> only with the name of Allah."], "lvl": [{"ar": "بِالقَلَمِ", "en": "with the pen"}, {"ar": "سَافَرْتُ مِنْ بَلَدِي إِلَى بَلَدٍ آخَرَ", "en": "I travelled from my country to another"}, {"ar": "رُبَّ صَدِيقٍ صَادِقٍ خَيْرٌ مِنْ أَخٍ بَعِيدٍ", "en": "many a true friend is better than a distant brother"}]}, {"t": "Khafḍ by iḍāfah", "v": [{"k": "map", "rows": [["غُلَامُ زَيْدٍ", "implies لِ", ["the boy of Zayd"], "k"], ["ثَوْبُ خَزٍّ", "implies مِنْ", ["a garment of silk"], "k"], ["بَابُ سَاجٍ", "implies مِنْ", ["a door of teak"], "k"], ["خَاتَمُ حَدِيدٍ", "implies مِنْ", ["a ring of iron"], "k"]], "n": null}], "ar": "وَأَمَّا مَا يُخْفَضُ بِالإِضَافَةِ: فَنَحْوُ قَوْلِكَ: غُلَامُ زَيْدٍ، وَهُوَ عَلَى قِسْمَيْنِ: مَا يُقَدَّرُ بِاللَّامِ، وَمَا يُقَدَّرُ بِمِنْ. فَالَّذِي يُقَدَّرُ بِاللَّامِ: نَحْوُ قَوْلِكَ: غُلَامُ زَيْدٍ. وَالَّذِي يُقَدَّرُ بِمِنْ: نَحْوُ قَوْلِكَ: ثَوْبُ خَزٍّ، وَبَابُ سَاجٍ، وَخَاتَمُ حَدِيدٍ. وَاللهُ أَعْلَمُ.", "en": "As for what is put in khafḍ by the possessive construction, an example is “the son of Zayd”. It is of two groups: that which implies lām, and that which implies min. The lām type is “the son of Zayd”; the min type is “a garment of silk, a door of teak, a ring of iron”.", "ex": ["Iḍāfah attributes a second word to the first: the first is the muḍāf, the second the muḍāf ilayhi, which takes khafḍ.", "Two types: the <b>lām</b> type (ghulāmu Zaydin, “the boy of Zayd”) and the <b>min</b> type, where the muḍāf ilayhi is the material (thawbu khazzin, “a garment of silk”).", "The third type of makhfūḍ, the follower, was already covered under the marfū' chapters. The matn ends with “And Allah knows best.”"], "lvl": [{"ar": "قَلَمُ زَيْدٍ", "en": "Zayd's pen"}, {"ar": "بَابُ خَشَبٍ", "en": "a door of wood"}, {"ar": "كِتَابُ تَارِيخِ المَدِينَةِ القَدِيمَةِ مَشْهُورٌ", "en": "the book of the old city's history is famous — a chain of iḍāfah"}]}];

function split(t){
 if(AE[t])return[AE[t],t];
 if(t.includes(" · ")){const i=t.indexOf(" · "),l=t.slice(0,i),r=t.slice(i+3);if(AR.test(l)&&!AR.test(r))return[l,r]}
 const m=t.match(/^([^A-Za-z0-9]*[\u0600-\u06FF][^A-Za-z0-9]*?)\s+([A-Za-z0-9].*)$/);
 if(m&&!AR.test(m[2]))return[m[1],m[2]];return null;
}
function vis(v){

 const cp=(t,c)=>{const p=split(t);return p?`<span class="cp ${c||"x"} tp" tabindex="0" role="button" aria-pressed="false" onclick="${TG};this.setAttribute('aria-pressed',this.classList.contains('sh'))">${p[0]}<small class="en">${p[1]}</small></span>`:`<span class="cp ${c||"x"}">${t}</span>`};
 let h="";
 if(v.t){const p=split(v.t);h+=p?`<small class="gt tp" tabindex="0" role="button" aria-pressed="false" onclick="${TG};this.setAttribute('aria-pressed',this.classList.contains('sh'))">${p[0]}<small class="en">${p[1]}</small></small>`:`<small class="gt">${v.t}</small>`}
 if(v.k=="tree")h+=`<div class="vt"><div class="root">${v.root}</div><div class="kids">${v.kids.map(k=>`<div class="kid ${k[2]||"x"} tp" tabindex="0" role="button" aria-pressed="false" onclick="${TG};this.setAttribute('aria-pressed',this.classList.contains('sh'))"><b>${k[0]}</b><small class="en">${k[1]}</small></div>`).join("")}</div></div>`;
 if(v.k=="map")h+=v.rows.map(r=>`<div class="mr"><div class="sg2 ${r[3]||"x"}${r[1]?" tp":""}" ${r[1]?`tabindex="0" role="button" aria-pressed="false" onclick="${TG};this.setAttribute('aria-pressed',this.classList.contains('sh'))"`:""}><span class="ar0">${r[0]}</span>${r[1]?`<small class="en">${r[1]}</small>`:""}</div><span class="ar-">→</span><div class="mc">${r[2].map(c=>cp(c,r[3])).join("")}</div></div>`).join("");
 if(v.k=="chips")h+=`<div class="mc">${v.items.map(c=>cp(c,v.tone)).join("")}</div>`;
 if(v.k=="ba")h+=v.rows.map(r=>`<div class="br">${(()=>{const p=split(r[0]);return p?`<small class="tp" tabindex="0" role="button" aria-pressed="false" onclick="${TG};this.setAttribute('aria-pressed',this.classList.contains('sh'))">${p[0]}<small class="en">${p[1]}</small></small>`:`<small>${r[0]}</small>`})()}${r[1].map(c=>cp(c[0],c[1])).join('<span class="pl2">+</span>')}</div>`).join("");
 if(v.k=="sent")h+=`<div class="se">${v.w.map(w=>{const l=w[1]&&w[1]!="x"?w[1]:"";return `<div class="wp ${w[2]||"x"}${l?" tp":""}" ${l?`tabindex="0" role="button" aria-pressed="false" onclick="${TG};this.setAttribute('aria-pressed',this.classList.contains('sh'))"`:""}><span class="ar0">${w[0]}</span>${l?`<small class="en">${l}</small>`:""}</div>`}).join("")}</div>`;

function memCount(){return Object.keys(prog).filter(k=>prog[k]).length}
function paintHead(){
 const d=D[idx],done=!!prog[idx];
 $("ct").innerHTML=`<span>Section ${idx+1} of ${D.length}</span>`+(done?'<span class="tag"><span aria-hidden="true">✓</span>Memorized</span>':"");
 $("mn").textContent=idx+1;
 $("mark").classList.toggle("done",done);
 $("segs").innerHTML=D.map((x,i)=>`<i class="${prog[i]?"d":""}${i==idx?" c":""}"></i>`).join("");
 const pw=$("pgwrap");pw.setAttribute("aria-valuenow",idx+1);pw.setAttribute("aria-valuemax",D.length);pw.setAttribute("aria-valuetext",`Section ${idx+1} of ${D.length}, ${memCount()} memorized`);

 $("nextb").disabled=idx==D.length-1;$("nextb").setAttribute("aria-disabled",idx==D.length-1);
 $("ti").textContent=d.t;
 const mc=memCount()+" of "+D.length+" memorized";
 document.querySelectorAll(".memc").forEach(e=>e.textContent=mc);
}
function pager(){
 const p=idx>0?`<button class="pgb pv" onclick="go(-1)"><span class="d">Previous</span><span class="tt">${D[idx-1].t}</span></button>`:"";
 const n=idx<D.length-1?`<button class="pgb nx" onclick="go(1)"><span class="d">Next</span><span class="tt">${D[idx+1].t}</span></button>`:"";
 return `<nav class="pager" aria-label="Previous and next section">${p}${n}</nav>`;
}
function dlistHTML(){

}
function render(){

  $("sg").setAttribute("role","group");$("sg").setAttribute("aria-label","Show on this page");
  h=`<div class="ar" lang="ar" dir="rtl">${d.ar}</div>`;
  if(show.vis&&d.v){const ae=document.body.classList.contains("allen");h+=`<section class="lay"><div class="lhead"><h3>Diagram</h3><button class="pl" aria-pressed="${ae}" onclick="allEn()">${ae?"Hide English":"Show all English"}</button></div><div class="lb"><p class="mu">Tap, hover, or press Enter on an Arabic word to see its English.</p>${vis(d.v)}</div></section>`}
  if(d.lvl){const L=["Beginner","Intermediate","Advanced"];const ex=d.lvl[lvlSel];
   h+=`<section class="lay"><h3>Examples by level</h3><div class="lb">
   <div class="lvltabs" role="tablist" aria-label="Difficulty level">${L.map((l,i)=>`<button role="tab" aria-selected="${lvlSel==i}" onclick="lvlSel=${i};render()">${l}</button>`).join("")}</div>
   <div class="lvlcard" tabindex="0" role="button" aria-label="Tap to reveal the English meaning" onclick="this.classList.toggle('sh')" onkeydown="if(event.key===' '||event.key=='Enter'){event.preventDefault();this.classList.toggle('sh')}">
    <span class="lvlbadge">${L[lvlSel]} example</span>
    <span class="ar0b" lang="ar" dir="rtl">${ex.ar}</span>
    <div class="reveal-en">${ex.en}</div>
   </div>
   <p class="mu" style="margin-top:10px">Tap the card to reveal the meaning.</p></div></section>`;
  }
  if(show.tr)h+=`<section class="lay"><h3>Translation</h3><div class="lb"><p>${d.en}</p></div></section>`;
  if(show.ex)h+=`<section class="lay"><h3>Explanation</h3><div class="lb">${d.ex.map(p=>`<p>${p}</p>`).join("")}${d.s?'<p class="mu">Short note. Not yet checked against the commentary.</p>':''}</div></section>`;
 }
 h+=pager();
 const hadFocus=$("dlist").contains(document.activeElement);

  $("dlist").innerHTML=dlistHTML();

const dr=$("dr");

function openDrawer(){lastFocus=document.activeElement;dr.classList.add("on");const f=dr.querySelector(".drhead button");f&&f.focus();keepCurrentInView()}
