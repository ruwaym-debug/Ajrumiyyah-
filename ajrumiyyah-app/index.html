const wide=matchMedia("(min-width:1000px)");
function syncDrawer(){const dl=$("dl");if(wide.matches){dr.classList.remove("on");dl.setAttribute("role","navigation");dl.removeAttribute("aria-modal")}else{dl.setAttribute("role","dialog");dl.setAttribute("aria-modal","true")}keepCurrentInView()}

function go(n){idx=Math.max(0,Math.min(D.length-1,idx+n));flip=false;render();scrollTo(0,0);$("main").focus({preventScroll:true})}
function memo(d){
 const bt=(k,l)=>`<button class="${mode==k?"on":""}" role="tab" aria-selected="${mode==k}" onclick="mode='${k}';flip=false;render()">${l}</button>`;
 let h=`<div class="md" role="tablist" aria-label="Memorize mode">${bt("hide","Hide words")}${bt("card","Flashcard")}${bt("rec","Recite")}</div><button class="fullbtn" aria-pressed="${!!prog[idx]}" onclick="prog[idx]=!prog[idx];save();render()">${prog[idx]?"✓ Memorized":"Mark memorized"}</button>`;
 if(mode=="hide"){
  h+=`<div class="md" role="group" aria-label="How much to hide">`+["Some","Most","All"].map((l,i)=>`<button class="${lvl==i+1?"on":""}" aria-pressed="${lvl==i+1}" onclick="lvl=${i+1};render()">Hide ${l.toLowerCase()}</button>`).join("")+`</div>`;
  h+=`<div class="ar" lang="ar" dir="rtl">${words(d.ar).map((x,i)=>{const hid=lvl==3||(lvl==2&&i%3!=0)||(lvl==1&&i%3==1);return `<span class="wd ${hid?"h":""}" role="button" tabindex="0" aria-pressed="${!hid}" aria-label="Word ${i+1}, tap to ${hid?"reveal":"hide"}" onclick="this.classList.toggle('h');this.setAttribute('aria-pressed',!this.classList.contains('h'))" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();this.click()}">${x}</span> `}).join("")}</div><p class="mu">Tap a blurred word to show it.</p>`;
 }else if(mode=="card"){
  h+=`<div class="md"><button aria-pressed="${!!fdir}" onclick="fdir=1-fdir;flip=false;render()">Showing ${fdir?"Arabic first":"English first"}</button></div>`;
  const f=fdir?`<div class="ar" lang="ar" dir="rtl" style="box-shadow:none;background:none;border:none">${d.ar}</div>`:`<div lang="en">${d.en}</div>`,b=fdir?`<div lang="en">${d.en}</div>`:`<div class="ar" lang="ar" dir="rtl" style="box-shadow:none;background:none;border:none">${d.ar}</div>`;
  h+=`<div class="fc" role="button" tabindex="0" aria-label="Flashcard, tap to flip" onclick="flip=!flip;render()" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();flip=!flip;render()}">${flip?b:f}</div><p class="mu">Tap the card to flip it.</p>`;
 }else{
  h+=`<div class="ar" id="tg" lang="ar" dir="rtl">${words(d.ar).map(x=>`<span>${x}</span>`).join(" ")}</div>
  <p style="text-align:center"><button class="mic" id="mic" onclick="listen()">Start reciting</button></p>
  <div class="lay solo" id="lvbox"><h3>What I hear</h3><p id="lv" dir="rtl" style="font-family:var(--ar);font-size:24px;line-height:1.9">—</p></div>
  <div class="lay solo" id="res"><p class="mu">Recite the text above, then tap Stop. Words turn green when heard, red when missed.</p></div>`;
 }
 return h;
}
let rec=null,want=false,base="",heard="",live="";
const lev=(a,b)=>{const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]};
const same=(n,h)=>n==h||(n.length>3&&lev(n,h)<=1)||(n.length>6&&lev(n,h)<=2);
function listen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$("res").innerHTML="<p>This browser can't do voice recognition (Firefox doesn't). Use Chrome, Edge or Safari.</p>";return}
 if(want){want=false;rec&&rec.stop();return}
 base=heard=live="";want=true;$("mic").textContent="Stop and check";$("res").innerHTML="<p>Listening…</p>";$("lv").textContent="…";
 const start=()=>{
  rec=new SR();rec.lang="ar-SA";rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{let f="",i2="";for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)f+=" "+r[0].transcript;else i2+=" "+r[0].transcript}heard=f;live=i2;$("lv").textContent=(base+f+i2).trim()||"…"};
  rec.onerror=e=>{
   if(e.error=="no-speech"||e.error=="aborted")return;
   want=false;
   const m={"not-allowed":"Microphone is blocked. Allow mic access for this site in your browser settings. If you're viewing this inside another app, open the page in Chrome or Safari directly.","service-not-allowed":"Speech service is blocked on this device or browser. Try Chrome or Safari.","audio-capture":"No microphone was found.","network":"Speech recognition needs an internet connection."};
   $("res").innerHTML="<p class='no'>"+(m[e.error]||"Mic error: "+e.error)+"</p>";
  };
  rec.onend=()=>{base+=" "+heard+" "+live;heard=live="";
   if(want){try{start();return}catch(e){want=false}}
   rec=null;$("mic").textContent="Start reciting";
   if($("res").textContent.indexOf("blocked")<0&&$("res").textContent.indexOf("Mic error")<0)check(base)};
  rec.start();
 };
 try{start()}catch(e){want=false;$("res").innerHTML="<p class='no'>Couldn't start the mic. Try again.</p>"}
}
function check(heard){
 const tw=words(D[idx].ar),hw=words(norm(heard)).map(norm).filter(Boolean);
 if(!hw.length){$("res").innerHTML="<p>Nothing was heard. Try again.</p>";return}
 let p=0,ok=0;const sp=$("tg").children;
 tw.forEach((w,i)=>{const n=norm(w);let f=-1;for(let j=p;j<Math.min(hw.length,p+6);j++)if(same(n,hw[j])){f=j;break}
  if(f>=0){p=f+1;ok++;sp[i].className="ok"}else sp[i].className="no"});
 const pc=Math.round(100*ok/tw.length);
 $("res").innerHTML=`<p><b>${pc}% of words matched</b> (${ok} of ${tw.length}).</p><p class="mu">Similar-sounding words count as a match. This checks words only, not vowel marks, so compare the ḥarakāt yourself.</p>`;
 if(pc>=90){prog[idx]=true;save();paintHead()}
}
